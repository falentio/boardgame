  <script>
    (function () {
      var DURATION = 6.763;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ══ Scene 1 (0.0–1.4) — ground, chrome, hero slides down into centre ══ */
      tl.fromTo("#f05-grid", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.out" }, 0);
      tl.fromTo(
        "#f05-bloom-a, #f05-bloom-b",
        { opacity: 0 },
        { opacity: 1, duration: 1.5, ease: "power2.out" },
        0.1
      );
      tl.fromTo("#f05-rule-stub", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.12);
      tl.fromTo("#f05-kicker", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);

      /* hero — spring-pop-entrance, slide-down settle (no overshoot) */
      tl.fromTo(
        "#f05-hero",
        { y: -150, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.15
      );

      /* ══ Scene 2 (1.4–3.0) — seats burst outward, marker steps along ══ */
      var SEAT_TARGETS = [
        { id: "#f05-seat-0", x: -459 },
        { id: "#f05-seat-1", x: -153 },
        { id: "#f05-seat-2", x: 153 },
        { id: "#f05-seat-3", x: 459 }
      ];
      var SEAT_Y = -30;
      var ENTRY_AT = 1.45;
      var STAGGER = 0.07;

      /* center-outward-expansion: shared centre origin, offsets from it */
      SEAT_TARGETS.forEach(function (seat, i) {
        tl.fromTo(
          seat.id,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.55, opacity: 0 },
          { x: seat.x, y: SEAT_Y, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" },
          ENTRY_AT + i * STAGGER
        );
      });

      tl.fromTo(
        "#f05-marker",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.95
      );

      /* the marker travels seat-to-seat as a POSITIONAL STEP — sparse threshold
         schedule + reverse search (discrete-text-sequence shape), each step
         easing into its slot over SETTLE so the step still reads as a slide. */
      var SEAT_LEFT = [371, 677, 983, 1289];
      var MARKER_SEQ = [
        { t: 2.0, x: SEAT_LEFT[0] },
        { t: 2.24, x: SEAT_LEFT[1] },
        { t: 2.46, x: SEAT_LEFT[2] },
        { t: 2.66, x: SEAT_LEFT[3] },
        { t: 2.88, x: SEAT_LEFT[1] }
      ];
      var SETTLE = 0.14;
      var markerTrack = document.getElementById("f05-marker-track");
      /* positional step, seek-safe form: one eased x-tween per seat hop (each is
         a real property tween, so it renders under a cold suppressed seek). */
      tl.set(markerTrack, { x: MARKER_SEQ[0].x }, 0);
      MARKER_SEQ.forEach(function (entry, idx) {
        if (idx === 0) return;
        tl.fromTo(
          markerTrack,
          { x: MARKER_SEQ[idx - 1].x },
          { x: entry.x, duration: SETTLE, ease: "power3.out", immediateRender: false },
          entry.t
        );
      });

      /* the locked seat takes the accent edge */
      tl.fromTo("#f05-seat-lock", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.02);

      /* ══ Scene 3 (3.0–4.6) — the mono pin lands, the other seats dim ══ */
      tl.fromTo(
        "#f05-pin",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.06
      );
      /* immediateRender:false — a later fromTo must not paint its from-state at
         t=0 and clobber the seats' own entrance from-state (opacity 0) */
      tl.fromTo(
        "#f05-seat-0, #f05-seat-2, #f05-seat-3",
        { opacity: 1 },
        { opacity: 0.35, duration: 0.55, ease: "power2.out", immediateRender: false },
        3.1
      );

      /* asr-keyword-glow — one linear driver, per-word envelope, karaoke register */
      var PIN_START = 3.12;
      var PIN_END = 3.92;
      var ATTACK = 0.18;
      var RELEASE = 0.45;
      var REST_LEVEL = 0.14;
      var MAX_BLUR = 34;
      var SCALE_BOOST = 0.14;

      function pinEnvelope(t) {
        if (t < PIN_START) return 0;
        if (t < PIN_END) return Math.min((t - PIN_START) / ATTACK, 1);
        var releaseEnd = PIN_END + RELEASE;
        if (t < releaseEnd) return 1 - ((t - PIN_END) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      var pinText = document.getElementById("f05-pin-text");
      /* asr-keyword-glow, seek-safe form: pre-sampled keyframes for the glow hug +
         scale (envelope values computed at build time, no callback under seek).
         The pin stays the fire-orange accent — no muddy gray→yellow midpoint. */
      /* sample the envelope across the real absolute window [GLOW_AT, GLOW_END] */
      var GLOW_AT = 3.02;
      var GLOW_END = 4.6;
      var GLOW_DUR = GLOW_END - GLOW_AT;
      var GLOW_STEPS = 24;
      var glowFrames = [];
      for (var gi = 0; gi <= GLOW_STEPS; gi++) {
        var gv = pinEnvelope(GLOW_AT + (gi / GLOW_STEPS) * GLOW_DUR);
        glowFrames.push({
          textShadow: "0 0 " + (MAX_BLUR * gv).toFixed(2) + "px rgba(255,237,114," + (gv * 0.8).toFixed(3) + ")",
          scale: 1 + SCALE_BOOST * gv
        });
      }
      tl.set(pinText, { textShadow: "0 0 0px rgba(255,237,114,0)", scale: 1 }, 0);
      tl.to(pinText, { keyframes: glowFrames, duration: GLOW_DUR, ease: "none" }, GLOW_AT);

      /* ══ Scene 4 (4.6–6.2) — the split: mirrored tilt cards + the aside ══ */
      tl.fromTo("#f05-divider", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.inOut" }, 4.62);

      /* focus shift, not an exit — the seat row recedes so the split owns the payoff */
      tl.fromTo(
        "#f05-seats, #f05-marker-track, #f05-seat-lock, #f05-pin",
        { opacity: 1 },
        { opacity: 0.55, duration: 0.6, ease: "power2.inOut", immediateRender: false },
        4.62
      );

      /* split-tilt-cards — opposing rotateY, pivot-into-place from each wing */
      tl.fromTo(
        "#f05-card-left",
        { x: -440, rotateY: 18, scale: 0.88, opacity: 0 },
        { x: 0, rotateY: 12, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        4.6
      );
      tl.fromTo(
        "#f05-card-right",
        { x: 440, rotateY: -18, scale: 0.88, opacity: 0 },
        { x: 0, rotateY: -12, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        4.8
      );
      /* copy fades up during the settle, never after it */
      tl.fromTo("#f05-card-left-row", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.85);
      tl.fromTo("#f05-card-right-row", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.05);

      tl.fromTo("#f05-subline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.65);

      /* sine-wave-loop — counter-phase idle on the pair, sin(0)=0 at the settle
         so the handoff from the entrance is seamless (left sin(t), right sin(t+π)) */
      var IDLE_START = 5.9;
      var IDLE_DUR = DURATION - IDLE_START;
      var IDLE_AMP = 4;
      var cardLeft = document.getElementById("f05-card-left");
      var cardRight = document.getElementById("f05-card-right");
      /* sine-wave-loop, seek-safe form: pre-sampled keyframes per card. */
      var IDLE_STEPS = 16;
      var idleL = [], idleR = [];
      for (var si = 0; si <= IDLE_STEPS; si++) {
        var sp = (si / IDLE_STEPS) * Math.PI * 2 * 0.5;
        idleL.push({ y: Math.sin(sp) * IDLE_AMP });
        idleR.push({ y: Math.sin(sp + Math.PI) * IDLE_AMP });
      }
      tl.to(cardLeft, { keyframes: idleL, duration: IDLE_DUR, ease: "none" }, IDLE_START);
      tl.to(cardRight, { keyframes: idleR, duration: IDLE_DUR, ease: "none" }, IDLE_START);

      window.__timelines["05-one-action-a-turn"] = tl;
      tl.seek(0);
    })();
  </script>
