  <script>
    (function () {
      var DURATION = 4.053;

      /* ONE tempo grid — every onset below reads from it (kinetic-beat-slam).
         The beats are the real VO cues: "Know when" ~1.52, "and when" ~2.88,
         "not to." ~3.36. */
      var PULSE = 0.08;
      var BEAT_RULE = PULSE * 3;       // 0.24 — chrome settles
      var BEAT_FLIP = PULSE * 19;      // 1.52 — "Know when"
      var BEAT_FACE = PULSE * 25;      // 2.00 — the revealed face lands
      var BEAT_TITLE = PULSE * 36;     // 2.88 — "and when"
      var BEAT_UNDERLINE = PULSE * 42; // 3.36 — "not to."

      var TILT = 12;                   // split-tilt-cards: opposing rotateY

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* collapsed start states pinned at t=0 — seek-safe, so a delayed
         entrance never flashes its CSS-default (visible) state beforehand */
      tl.set(["#f11-cardA", "#f11-cardB"], { opacity: 0 }, 0);
      tl.set(["#f11-rule-stub", "#f11-divider", "#f11-underline"], { scaleX: 0 }, 0);
      tl.set(["#f11-kicker", "#f11-num"], { opacity: 0, y: -10 }, 0);
      tl.set("#f11-face-inner", { opacity: 0, scale: 1.12, filter: "blur(8px)" }, 0);
      tl.set("#f11-title", { opacity: 0, scale: 1.5, filter: "blur(16px)" }, 0);

      /* ── Scene 1 (0.0–1.4) : ink field, chrome, Frame 1's pair returns ── */
      tl.fromTo("#f11-grid", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo(
        "#f11-rule-stub",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.08
      );
      tl.fromTo(
        "#f11-kicker",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.16
      );
      tl.fromTo(
        "#f11-num",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.24
      );

      /* the pair returns — the SAME slide-up settle as Frame 1
         (spring-pop-entrance: scale 0.62 -> 1, power3.out, no overshoot) */
      tl.fromTo(
        "#f11-cardA",
        { y: 132, scale: 0.62, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.1
      );
      tl.fromTo(
        "#f11-cardB",
        { y: 132, scale: 0.62, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.46
      );

      /* ── Scene 2 (1.4–3.2) : on "Know when to tell the truth" the left
         card flips face-up in mk-red — one life spent — and the pair pivots
         into the opposing-tilt book-open (split-tilt-cards). ──────────── */
      tl.fromTo(
        "#f11-cardA",
        { rotationY: 0 },
        { rotationY: 180 + TILT, duration: 0.9, ease: "power3.inOut" },
        BEAT_FLIP
      );
      tl.fromTo(
        "#f11-cardB",
        { rotationY: 0 },
        { rotationY: -TILT, duration: 0.9, ease: "power3.out" },
        BEAT_FLIP
      );

      /* the revealed face lands as the card finishes turning */
      tl.fromTo(
        "#f11-face-inner",
        { opacity: 0, scale: 1.12, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        BEAT_FACE
      );

      /* ── Scene 3 (3.2–end) : on "and when not to" the title locks up
         beneath the pair (kinetic-beat-slam — the scale+blur slam hit),
         then the frame holds still. ───────────────────────────────────── */
      tl.fromTo(
        "#f11-title",
        { opacity: 0, scale: 1.5, filter: "blur(16px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" },
        BEAT_TITLE
      );
      tl.fromTo(
        "#f11-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
        BEAT_UNDERLINE
      );

      /* the hairline divider draws in early, as ambient structure */
      tl.fromTo(
        "#f11-divider",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power2.inOut" },
        BEAT_RULE
      );

      /* ── the held read: at most a low-amplitude jitter on the lockup —
         one long tween, sin(0)=0 at the settle so there is no jump. ──── */
      var IDLE_START = 3.45;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 0.35;
      var Y_AMP_PX = 1.4;
      var titleWrap = document.getElementById("f11-title-wrap");
      /* sine-wave-loop, seek-safe form: pre-sampled keyframes. */
      var IDLE_STEPS = 16;
      var idleFrames = [];
      for (var si = 0; si <= IDLE_STEPS; si++) {
        idleFrames.push({ y: Math.sin((si / IDLE_STEPS) * Math.PI * 2 * CYCLES) * Y_AMP_PX });
      }
      tl.to(titleWrap, { keyframes: idleFrames, duration: IDLE_DUR, ease: "none" }, IDLE_START);
