      /* collapsed start states pinned at t=0 — seek-safe, so a delayed entrance

      /* ══ Scene 1 (0.0–1.05) — the same stamp lands, the field flips register ══ */

      /* the challenge stamp — kinetic-beat-slam: scale + blur slam, hard attack */
      tl.fromTo(
        "#f08-stamp",

      /* the field hard-cuts to the accent register — scale-swap-transition: the

      tl.fromTo(
        "#f08-field-accent",
        { scale: 0.72, opacity: 0 },

      /* ink-on-accent chrome rides the flip */
      tl.fromTo(
        "#f08-rule",

      /* the redaction bar sweeps across the blank face */

      tl.fromTo(
        "#f08-tagA",
        { opacity: 0, y: 8 },

      /* ══ Scene 2 (1.05–2.02) — the claimant's own card turns face-up ══ */

      /* split-tilt-cards: the rotateY flip, under the pos wrapper's perspective */
      tl.fromTo(

      var CRASH_AT = 2.02;
      var CRASH_DUR = 0.85;
      var VICTIM_FRACTION = 0.45; /* victims finish at 45% of the driver window */
      var VICTIM_DUR = CRASH_DUR * VICTIM_FRACTION;
      var SPLIT = 282;

      /* the verdict crashes in from off-screen with a heavy long-tail settle
         (ticker-takeover: mass, not zip) */
      tl.fromTo(
        "#f08-hero",
        { y: -900, scale: 0.94 },
        { y: 0, scale: 1, duration: CRASH_DUR, ease: "power2.out" },

      );
      tl.fromTo(
        "#f08-hero",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "none" },
        CRASH_AT
      );

      /* directional streak blur — the SAME window + ease, resolving sharp at the land */
      var blurNode = document.getElementById("f08-streak-blur");

      );

      tl.fromTo(
        "#f08-cardA-pos",
        { x: 0, rotation: 0 },
        { x: -SPLIT, rotation: -2.4, duration: VICTIM_DUR, ease: "power2.out" },

      tl.fromTo(

      ["#f08-coinA", "#f08-coinB", "#f08-coinC"].forEach(function (id, i) {

      var IDLE_START = 2.98;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 0.22;
      var heroEl = document.getElementById("f08-hero");
      /* sine-wave-loop, seek-safe form: pre-sampled keyframes. */
      var IDLE_STEPS = 16;
      var idleFrames = [];
      for (var si = 0; si <= IDLE_STEPS; si++) {
        var s = Math.sin((si / IDLE_STEPS) * Math.PI * 2 * CYCLES);
        idleFrames.push({ y: s * 1.6, scale: 1 + s * 0.008 });
      }
      tl.to(heroEl, { keyframes: idleFrames, duration: IDLE_DUR, ease: "none" }, IDLE_START);
