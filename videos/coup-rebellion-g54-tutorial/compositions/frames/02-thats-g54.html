        { scale: 1.5, opacity: 0, filter: "blur(16px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
        BEATS[0],
      );

      /* discrete-text-sequence — whole text STATES swapped at a frame threshold.
         Each state is a zero-duration property set: the jump is INSTANT (no
         transition on text) and, unlike a callback, a property tween is
         seek-safe AND reversible, so a backward seek restores the earlier token
         exactly. This hard cut is the beat. */
      var HERO_SEQ = [
        { t: 0.0, text: "that\u2019s" },

         IDLE_DUR > 6s, so amplitudes sit at the low end, the period is slowed

      var IDLE_START = 1.1;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 2.05; /* period ≈ 3.0s */

      var STEPS = 16;
      var STEP_DUR = IDLE_DUR / STEPS;
      var idleFrames = [];
      for (var i = 1; i <= STEPS; i++) {
        var frac = i / STEPS;
        var env = frac < 1 - FADE_FRAC ? 1 : (1 - frac) / FADE_FRAC;
        var p = Math.PI * 2 * CYCLES * frac;
        var s1 = Math.sin(p) * env;
        var s2 = Math.sin(p * 3) * env;

          scale: 1 + s1 * SCALE_AMP + s2 * SCALE_AMP * 0.35,
          rotation: s1 * ROT_AMP + s2 * ROT_AMP * 0.3,
          duration: STEP_DUR,
          ease: "none",
