<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  /* ---- Scene 1 - an empty five-slot rail across the centre, hairline-divided.
     On "Tonight's five" the rail draws itself in (svg-path-draw): every path is
     measured with getTotalLength() - real geometry, never a magic number - and
     each segment starts at ~75% of the previous one, so the eye reads one
     continuous stroke rather than six isolated animations. ---- */
  var rail = [
    ["f04-rail-top", 0.02, 0.24],
    ["f04-rail-d1", 0.18, 0.15],
    ["f04-rail-d2", 0.24, 0.15],
    ["f04-rail-d3", 0.30, 0.15],
    ["f04-rail-d4", 0.36, 0.15],
    ["f04-rail-bottom", 0.42, 0.22]
  ];
  rail.forEach(function (spec) {
    var el = document.getElementById(spec[0]);
    if (!el) return;
    var len = el.getTotalLength();
    el.style.strokeDasharray = String(len);
    tl.fromTo(el,
      { strokeDashoffset: len },
      { strokeDashoffset: 0, duration: spec[2], ease: "power2.out" },
      spec[1]);
  });

  /* the chrome and the deep underprint settle in around the rail */
  tl.fromTo("#f04-vignette", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);
  tl.fromTo("#f04-underprint", { opacity: 0 }, { opacity: 0.14, duration: 1.5, ease: "power1.out" }, 0.06);
  tl.fromTo("#f04-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.02);
  tl.fromTo("#f04-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.10);
  tl.fromTo("#f04-meta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.18);
  tl.fromTo("#f04-hairline", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.20);

  /* ---- Scene 2 - one card lands per spoken name, sliding up into its slot
     (spring-pop-entrance, paced to the roll call: Banker, Director, Guerrilla,
     Politician, Peacekeeper). Each card's mark draws in just behind it. ----
     ---- Scene 3 - on "one from each category" a mono category tag snaps under
     each card in its own category hue (staggered pop), and the card's own top
     edge takes that hue at the same instant - the colour key for the whole
     video. Then it holds. No exit: the root transition is the exit. ---- */
  var cards = [
    { card: "f04-card-banker",      glyph: "f04-glyph-banker",      tag: "f04-tag-banker",      at: 0.48, tagAt: 4.72, hue: "#FFB270" },
    { card: "f04-card-director",    glyph: "f04-glyph-director",    tag: "f04-tag-director",    at: 1.32, tagAt: 4.84, hue: "#7CD5F1" },
    { card: "f04-card-guerrilla",   glyph: "f04-glyph-guerrilla",   tag: "f04-tag-guerrilla",   at: 2.02, tagAt: 4.96, hue: "#FF6D7E" },
    { card: "f04-card-politician",  glyph: "f04-glyph-politician",  tag: "f04-tag-politician",  at: 2.78, tagAt: 5.08, hue: "#A2E57B" },
    { card: "f04-card-peacekeeper", glyph: "f04-glyph-peacekeeper", tag: "f04-tag-peacekeeper", at: 3.66, tagAt: 5.20, hue: "#A2E57B" }
  ];

  cards.forEach(function (c) {
    tl.fromTo("#" + c.card,
      { scale: 0, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      c.at);

    var glyphPaths = Array.prototype.slice.call(
      document.querySelectorAll("#" + c.glyph + " .f04-gp")
    );
    glyphPaths.forEach(function (p) {
      var len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      tl.fromTo(p,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        c.at + 0.34);
    });

    tl.fromTo("#" + c.tag,
      { scale: 0, opacity: 0, y: 12 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      c.tagAt);

    tl.fromTo("#" + c.card,
      { borderTopColor: "#414B50" },
      { borderTopColor: c.hue, duration: 0.25, ease: "power1.out" },
      c.tagAt);
  });

  /* the macro move underneath the whole shot: one slow push-in */
  tl.fromTo("#f04-strip", { scale: 1 }, { scale: 1.03, duration: 6.1, ease: "none" }, 0.04);

  window.__timelines["04-tonights-five"] = tl;

})();
