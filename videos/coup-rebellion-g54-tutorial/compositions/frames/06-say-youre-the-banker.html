<script>
  (function () {
    var P = "06-say-youre-the-banker-";
    function el(n) {
      return document.getElementById(P + n);
    }

    var world = el("world");
    var ringBase = el("ring-base");
    var ringDraw = el("ring-draw");
    var treasury = el("treasury");
    var treasuryLabel = el("treasury-label");
    var discs = [el("disc-0"), el("disc-1"), el("disc-2"), el("disc-3"), el("disc-4"), el("disc-5")];
    var seatMarks = [el("seat-mark-0"), el("seat-mark-1")];
    var seatLabels = [el("seat-label-0"), el("seat-label-1")];
    var chip = el("chip");
    var chipTag = el("chip-tag");
    var card = el("card");
    var cardSeat = el("card-seatmark");
    var cardClaimant = el("card-claimant");
    var cardCoins = el("card-coinslabel");
    var counter = el("counter");
    var coins = [el("coin-0"), el("coin-1"), el("coin-2")];
    var stamp = el("stamp");
    var chromeRule = el("chrome-rule");
    var chromeLeft = el("chrome-label-left");
    var chromeRight = el("chrome-label-right");

    // The ring's length is MEASURED, never guessed (svg-path-draw).
    var ringLen = 0;
    try {
      ringLen = ringDraw.getTotalLength();
    } catch (err) {
      ringLen = 0;
    }
    if (!ringLen || !isFinite(ringLen) || ringLen <= 0) ringLen = 3080;
    ringDraw.style.strokeDasharray = String(ringLen);
    ringDraw.style.strokeDashoffset = String(ringLen);

    var DUR = 4.565;
    var tl = gsap.timeline({ paused: true });

    // ── camera: one short settle-in, then LOCKED. The table does the moving.
    tl.fromTo(world, { scale: 1.038 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0);

    // ── chrome
    tl.fromTo(chromeRule, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.04);
    tl.fromTo(
      [chromeLeft, chromeRight],
      { opacity: 0, y: -10 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0.1
    );

    // ══ Scene 1 (0.0–1.6s) — "Say you're the Banker"
    //    the table establishes (60/40: treasury above, claimant seat below), then the
    //    claim chip rises over the claimant in claimed-type (slide-up settle).
    tl.fromTo(ringBase, { opacity: 0 }, { opacity: 0.22, duration: 0.7, ease: "power1.out" }, 0.1);
    tl.fromTo(
      seatMarks,
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.4, stagger: 0.08, ease: "power3.out" },
      0.42
    );
    tl.fromTo(
      seatLabels,
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" },
      0.5
    );

    tl.fromTo(
      treasury,
      { opacity: 0, scale: 0.94, y: -14 },
      { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.06
    );
    discs.forEach(function (d, i) {
      tl.fromTo(
        d,
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.18 + i * 0.05
      );
    });
    tl.fromTo(treasuryLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.34);

    tl.fromTo(card, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.16);
    tl.fromTo(
      [cardSeat, cardClaimant, cardCoins],
      { opacity: 0 },
      { opacity: 1, duration: 0.4, stagger: 0.07, ease: "power1.out" },
      0.4
    );

    // the claim chip — slide-up settle (spring-pop-entrance, calm settle)
    tl.fromTo(
      chip,
      { opacity: 0, scale: 0.62, y: 76 },
      { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "power3.out" },
      0.24
    );
    tl.fromTo(chipTag, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.82);

    // ══ Scene 2 (1.6–3.6s) — "and you take three coins"
    //    three coins slide out of the treasury to the claimant, one per beat;
    //    the mono counter ticks 2 → 5 while its scale grows to final size.
    coins.forEach(function (c, i) {
      tl.fromTo(
        c,
        { x: 0, y: -538, scale: 0.5, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.64, ease: "power3.out" },
        1.5 + i * 0.4
      );
    });
    [3, 4, 5].forEach(function (di, i) {
      tl.to(discs[di], { opacity: 0.14, duration: 0.42, ease: "power2.in" }, 1.5 + i * 0.4);
    });

    /* counting-dynamic-scale, seek-safe form: a numeric textContent tween with
       snap — a real property tween, so it renders under a cold suppressed seek
       (an onUpdate driver would freeze at the authored start value). */
    tl.fromTo(counter, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.3);
    tl.fromTo(counter, { scale: 0.45 }, { scale: 1, duration: 1.45, ease: "power3.out" }, 1.4);
    tl.to(
      counter,
      {
        textContent: 5,
        snap: { textContent: 1 },
        duration: 1.45,
        ease: "power3.out",
      },
      1.4
    );

    // ══ Scene 3 (3.6–5.4s) — "Nobody's checked anything yet"
    //    a dashed challenge ring DRAWS ON around the table, then retracts unclaimed.
    tl.fromTo(ringDraw, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.76);
    tl.fromTo(ringDraw, { strokeDashoffset: ringLen }, { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" }, 2.76);
    tl.to(ringDraw, { strokeDashoffset: ringLen, duration: 0.46, ease: "power2.in" }, 3.56);

    // ══ Scene 4 — the claim stands (the window closes, unclaimed) — held read
    tl.fromTo(
      stamp,
      { opacity: 0, scale: 0.5, rotation: -7 },
      { opacity: 1, scale: 1, rotation: -2, duration: 0.5, ease: "power3.out" },
      3.9
    );
    tl.to(coins, { y: -6, duration: 0.18, ease: "power2.out" }, 3.86);
    tl.to(coins, { y: 0, duration: 0.42, ease: "power3.out" }, 4.04);

    // span the whole frame
    tl.to({}, { duration: DUR }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["06-say-youre-the-banker"] = tl;
  })();
</script>
