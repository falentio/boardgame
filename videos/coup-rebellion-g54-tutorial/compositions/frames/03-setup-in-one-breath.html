  <script>
    (function () {
      var DUR = 6.677;
      var tl = gsap.timeline({ paused: true });

      function all(sel, scope) {
        return Array.prototype.slice.call((scope || document).querySelectorAll(sel));
      }

      var pads = all(".f03-pad");
      var railCards = all(".f03-railcard");
      var railCount = document.querySelector(".f03-rail-count");

      var CX = 960, CY = 454;
      var SEATS = [[270, 216], [1650, 216], [270, 692], [1650, 692]];

      /* Scene 1 (0.0-1.4s) - ink field, faint hairline ring, four seat markers
         radiate outward from the table centre (center-outward-expansion). */
      all(".f03-ring").forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0 },
          { opacity: Number(el.getAttribute("data-op")), duration: 0.7, ease: "power2.out" },
          0.05 + i * 0.09);
      });
      tl.fromTo(".f03-chrome", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.34);

      pads.forEach(function (pad, i) {
        var at = 0.12 + i * 0.065;
        tl.fromTo(pad,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.55, opacity: 0 },
          {
            x: Number(pad.getAttribute("data-tx")),
            y: Number(pad.getAttribute("data-ty")),
            scale: 1, opacity: 1, duration: 0.8, ease: "power3.out"
          },
          at);
        tl.fromTo(pad.querySelector(".f03-pad-label"),
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          at + 0.24);
      });

      /* Scene 2 (1.4-3.2s) - two mk-orange coins slide to each seat in a
         staggered cascade (spring-pop-entrance); the mono counter ticks 0 -> 2. */
      var COIN_AT = 1.45, COIN_STAG = 0.085, COIN_DUR = 0.55;
      pads.forEach(function (pad, i) {
        var seat = SEATS[i];
        var dx = seat[0] - CX, dy = seat[1] - CY;
        var len = Math.sqrt(dx * dx + dy * dy);
        var sx = Math.round(-(dx / len) * 150);
        var sy = Math.round(-(dy / len) * 150);
        all(".f03-coin", pad).forEach(function (coin, j) {
          var at = COIN_AT + (i * 2 + j) * COIN_STAG;
          tl.fromTo(coin,
            { x: sx, y: sy, scale: 0, opacity: 0 },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: COIN_DUR, ease: "power3.out" },
            at);
        });
        var count = pad.querySelector(".f03-pad-count");
        var tick = COIN_AT + (i * 2 + 1) * COIN_STAG + COIN_DUR + 0.05;
        tl.set(count, { textContent: "0" }, 0);
        tl.set(count, { textContent: "1" }, tick);
        tl.set(count, { textContent: "2", color: "#F2FFFC" }, tick + 0.16);
      });

      /* Scene 3 (3.2-4.8s) - two card backs deal to every seat in the same
         cascade order via staggered slide-up (spring-pop-entrance), face down. */
      var CARD_AT = 3.3, CARD_STAG = 0.075, CARD_DUR = 0.5;
      pads.forEach(function (pad, i) {
        all(".f03-cardback", pad).forEach(function (card, j) {
          var at = CARD_AT + (i * 2 + j) * CARD_STAG;
          tl.fromTo(card,
            { y: 34, opacity: 0, scale: 0.88 },
            { y: 0, opacity: 1, scale: 1, duration: CARD_DUR, ease: "power3.out" },
            at);
        });
      });

      /* Scene 4 (4.8-6.68s) - the seats dim to 40% and the role rail assembles
         across the centre (grid-card-assemble signature: staggered cascade into
         the strip), then five faces flip up in sequence. */
      tl.to(".f03-seats", { opacity: 0.4, duration: 0.55, ease: "power2.inOut" }, 4.5);
      tl.fromTo(".f03-band-rule", { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out", transformOrigin: "0% 50%", stagger: 0.08 }, 4.45);
      tl.fromTo(".f03-rail-kicker", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.68);
      tl.fromTo(".f03-rail-count", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.68);
      tl.set(railCount, { textContent: "0" }, 0);

      railCards.forEach(function (card, i) {
        tl.fromTo(card,
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          4.52 + i * 0.06);
      });
      railCards.forEach(function (card, i) {
        var t = 5.2 + i * 0.14;
        tl.to(card, { scaleY: 0.02, duration: 0.16, ease: "power2.in" }, t);
        tl.set(card.querySelector(".f03-railback"), { opacity: 0 }, t + 0.16);
        tl.to(card, { scaleY: 1, duration: 0.22, ease: "power3.out" }, t + 0.16);
        tl.set(railCount, { textContent: String(i + 1) }, t + 0.18);
      });

      /* one faint camera push under the whole shot (blueprint hold grammar) */
      tl.fromTo(".f03-cam", { scale: 1 }, { scale: 1.018, duration: DUR, ease: "none" }, 0);

      window.__timelines["03-setup-in-one-breath"] = tl;
      tl.seek(0);
    })();
  </script>
