      tl.fromTo("#f07-q", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.22);

      /* asr-keyword-glow — ONE linear driver for the whole phrase (here: the one glyph).
         Karaoke register: dim -> bright + blur + scale, decaying to a rest level (never 0). */
      var GLOW_AT = 0.4;
      var GLOW_DUR = 2;
      var ATTACK_DUR = 0.18;
      var RELEASE = 0.45;
      var REST_LEVEL = 0.12;
      var MAX_BLUR = 34;
      var MAX_SCALE_BOOST = 0.16;
      var Q_WIN = { start: 0.2, end: 1.55 };
      var REST_RGB = { r: 97, g: 108, b: 111 };
      var ACTIVE_RGB = { r: 255, g: 237, b: 114 };
      var qGlyph = document.getElementById("f07-q-glyph");

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);

      }

      var GLOW_STEPS = 24;

        var env = envelope(GLOW_AT + (gi / GLOW_STEPS) * GLOW_DUR, Q_WIN.start, Q_WIN.end);
        glowFrames.push({
          color: "rgb(" + mix(REST_RGB.r, ACTIVE_RGB.r, env) + "," +
            mix(REST_RGB.g, ACTIVE_RGB.g, env) + "," +
            mix(REST_RGB.b, ACTIVE_RGB.b, env) + ")",
          textShadow: "0 0 " + MAX_BLUR * env + "px rgba(255,237,114," + 0.72 * env + ")",
          scale: 1 + MAX_SCALE_BOOST * env

        textShadow: "0 0 0px rgba(255,237,114,0)",

      /* phrase B — a different entrance on the SAME grid */
      tl.fromTo("#f07-stamp-mono", { x: -330, opacity: 0 }, { x: 0, opacity: 0.88, duration: 0.45, ease: "expo.out" }, BEATS[1]);
