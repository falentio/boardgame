          "#f09-hr-orange",
          "#f09-win1",

      tl.fromTo("#f09-stub-dark", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.06);
      tl.fromTo(
        "#f09-hr-chrome",

      gsap.utils.toArray(".f09-slot").forEach(function (el, i) {

        tl.fromTo(

          { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.46, ease: "power3.out" },

          { opacity: 0, y: 8 },

      var COUNT_DUR = 1.5;
      var COUNT_TO = 5625;
      var STEPS = 30;
      var countEase = gsap.parseEase("sine.inOut");
      var rows = [];
      for (var f = 0; f <= STEPS; f += 1) {
        rows.push(Math.round(COUNT_TO * countEase(f / STEPS)).toLocaleString("en-US"));

      tl.fromTo(

         A seek never fires an onUpdate, so the offsets are precomputed and
         written as sets — every seek lands on the same sub-pixel state. */
      var JITTER_AT = URL_AT + 0.75;
