  <script>
    (function () {
      "use strict";

      var DURATION = 15.125;
      var STRIP_START = 3.05;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Landing ease, adapted from spring-stack-shuffle's landEase: a
         zero-slope ballistic hang, ONE small sanctioned overshoot past the
         target, then a zero-slope settle. Pure function of progress, so any
         seek in either direction reproduces the same frame. */
      function landEase(overshoot) {
        return function (u) {
          if (u < 0.62) {
            var a = u / 0.62;
            return (1 + overshoot) * a * a * (3 - 2 * a);
          }
          var b = (u - 0.62) / 0.38;
          return 1 + overshoot - overshoot * b * b * (3 - 2 * b);
        };
      }

      /* Collapsed start states pinned at t=0, so a delayed entrance never
         flashes its CSS-visible state and a seek back to 0 restores it. */
      tl.set(
        [
          "#f02-title",
          "#f02-stub",
          "#f02-kicker",
          "#f02-strip-rule",
          "#f02-div1",
          "#f02-div2",
          "#f02-chip1",
          "#f02-chip2",
          "#f02-chip3",
          "#f02-strip-progress",
          "#f02-deck",
          "#f02-card1",
          "#f02-card2",
          "#f02-truth",
          "#f02-stamp1-life",
          "#f02-stamp1-power",
          "#f02-stamp2-life",
          "#f02-stamp2-power"
        ],
        { opacity: 0 },
        0
      );

      /* ── Scene 1 (0.0–3.0) : the title pops, then the kicker slides up ────
         spring-pop-entrance, smooth long-tail settle — power3.out, no
         overshoot. Hero is on screen by t = 0.18 + first frames. */
      tl.fromTo(
        "#f02-title",
        { opacity: 0, scale: 0.78, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.72, ease: "power3.out" },
        0.18
      );
      tl.fromTo(
        "#f02-stub",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" },
        0.55
      );
      tl.fromTo(
        "#f02-kicker",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        2.15
      );

      /* ── Scene 2 (3.0–7.0) : the fact strip assembles ─────────────────────
         dynamic-content-sequencing — each chip's window is computed from its
         content length plus a per-item hold, so the sequencer assigns every
         start/end itself. Nothing is hand-offset per chip. */
      var CHIPS = [
        { value: "3-6", label: "players", chars: 10, hold: 0.55 },
        { value: "~15", label: "minutes", chars: 10, hold: 0.55 },
        { value: "none", label: "coup required", chars: 17, hold: 1.0 }
      ];
      var BASE_DURATION = 0.45;
      var SEC_PER_CHAR = 0.03;
      var CHIP_ENTRANCE = 0.5;

      var cumulative = STRIP_START;
      var CHIP_TIMELINE = CHIPS.map(function (entry) {
        var dur = BASE_DURATION + entry.chars * SEC_PER_CHAR + entry.hold;
        var start = cumulative;
        cumulative += dur;
        return { start: start, end: cumulative, activeAt: start + CHIP_ENTRANCE + 0.1 };
      });
      var STRIP_END = CHIP_TIMELINE[CHIP_TIMELINE.length - 1].end;

      tl.fromTo(
        ["#f02-strip-rule", "#f02-div1", "#f02-div2", "#f02-strip-progress"],
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.inOut" },
        3.05
      );

      var valueEls = [
        document.getElementById("f02-chipval1"),
        document.getElementById("f02-chipval2"),
        document.getElementById("f02-chipval3")
      ];
      var labelEls = [
        document.getElementById("f02-chiplabel1"),
        document.getElementById("f02-chiplabel2"),
        document.getElementById("f02-chiplabel3")
      ];

      /* Each chip lands on its spoken cue; the active one brightens out of the
         monochrome field a beat after it seats. */
      function paintStrip(activeIndex) {
        for (var i = 0; i < CHIP_TIMELINE.length; i++) {
          var on = i <= activeIndex;
          valueEls[i].style.color = on ? "#f0ece5" : "#888880";
          labelEls[i].style.color = on ? "#888880" : "#505048";
        }
      }
      paintStrip(-1);

      CHIP_TIMELINE.forEach(function (chip, i) {
        tl.fromTo(
          "#f02-chip" + (i + 1),
          { opacity: 0, scale: 0.9, y: 14 },
          { opacity: 1, scale: 1, y: 0, duration: CHIP_ENTRANCE, ease: "power3.out" },
          chip.start
        );
      });

      /* One linear driver carries the strip's own run bar; the active entry is
         reverse-searched out of the pre-computed TIMELINE, and the colour swap
         fires only on an entry change — no per-frame DOM thrash. */
      var stripDriver = { t: STRIP_START };
      var lastActive = -2;
      var progressFill = document.getElementById("f02-strip-fill");

      tl.to(
        stripDriver,
        {
          t: STRIP_END,
          duration: STRIP_END - STRIP_START,
          ease: "none",
          onUpdate: function () {
            var active = -1;
            for (var i = CHIP_TIMELINE.length - 1; i >= 0; i--) {
              if (stripDriver.t >= CHIP_TIMELINE[i].activeAt) {
                active = i;
                break;
              }
            }
            if (active !== lastActive) {
              paintStrip(active);
              lastActive = active;
            }
            var pct = ((stripDriver.t - STRIP_START) / (STRIP_END - STRIP_START)) * 100;
            progressFill.style.width = Math.max(0, Math.min(100, pct)).toFixed(2) + "%";
          }
        },
        STRIP_START
      );

      /* ── Scene 3 (7.0–13.0) : the deal, with real mass ────────────────────
         spring-stack-shuffle's deal-and-settle: lift off the deck, arc in,
         land with one small overshoot — and the settled card takes the weight
         of the next one landing. Chained segments are explicit fromTo pairs
         with immediateRender off, so neither clobbers the other at build. */
      tl.fromTo(
        "#f02-deck",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.45
      );

      var A_X = -437;
      var A_Y = -308;
      gsap.set("#f02-card1", { x: A_X, y: A_Y, scale: 0.84, rotation: -14, opacity: 0 });

      tl.fromTo(
        "#f02-card1",
        { opacity: 0, x: A_X, y: A_Y, scale: 0.84, rotation: -14 },
        { opacity: 1, x: -205, y: -150, scale: 0.93, rotation: -7, duration: 0.26, ease: "power2.out" },
        6.9
      );
      tl.fromTo(
        "#f02-card1",
        { opacity: 1, x: -205, y: -150, scale: 0.93, rotation: -7 },
        {
          opacity: 1,
          x: 0,
          y: 0,
          scale: 1,
          rotation: -1.6,
          duration: 0.46,
          ease: landEase(0.05),
          immediateRender: false
        },
        7.16
      );

      var B_X = -859;
      var B_Y = -294;
      gsap.set("#f02-card2", { x: B_X, y: B_Y, scale: 0.84, rotation: 14, opacity: 0 });

      tl.fromTo(
        "#f02-card2",
        { opacity: 0, x: B_X, y: B_Y, scale: 0.84, rotation: 14 },
        { opacity: 1, x: -400, y: -140, scale: 0.93, rotation: 8, duration: 0.26, ease: "power2.out" },
        7.55
      );
      tl.fromTo(
        "#f02-card2",
        { opacity: 1, x: -400, y: -140, scale: 0.93, rotation: 8 },
        {
          opacity: 1,
          x: 0,
          y: 0,
          scale: 1,
          rotation: 2.1,
          duration: 0.46,
          ease: landEase(0.05),
          immediateRender: false
        },
        7.81
      );

      /* the deck gives up its weight, one card at a time */
      tl.fromTo(
        "#f02-deck",
        { x: 0, y: 0 },
        { x: -4, y: 5, duration: 0.4, ease: "power2.out", immediateRender: false },
        6.92
      );
      tl.fromTo(
        "#f02-deck",
        { x: -4, y: 5 },
        { x: -8, y: 10, duration: 0.4, ease: "power2.out", immediateRender: false },
        7.58
      );

      /* compress-resettle: card one takes the weight of card two landing */
      tl.fromTo(
        "#f02-card1",
        { y: 0 },
        { y: 7, duration: 0.13, ease: "power2.out", immediateRender: false },
        8.27
      );
      tl.fromTo(
        "#f02-card1",
        { y: 7 },
        { y: 0, duration: 0.24, ease: "power2.out", immediateRender: false },
        8.4
      );

      /* the stamps: "life" as each card seats, "claimed power" on the cue */
      tl.fromTo(
        "#f02-stamp1-life",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.64
