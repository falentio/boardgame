      var tl = gsap.timeline({ paused: true });

      /* Landed ease: zero-slope hang, ONE small overshoot past the target,
         then a zero-slope settle. Pure function of progress, so a seek in
         either direction reproduces the same frame. */
      function landEase(overshoot) {
        return function (u) {
          if (u < 0.62) {
            var a = u / 0.62;
            return (1 + overshoot) * a * a * (3 - 2 * a);
          }
          var b = (u - 0.62) / 0.38;
          return 1 + overshoot - overshoot * b * b * (3 - 2 * b);
        };
      }
      var LAND = landEase(0.08);

      /* ══ Scene 1 (0.0–3.4s) — the hand settles, the loser picks the flip ══
         "Lose a life, and you choose which card flips face-up."
         Ground, ambient and chrome arrive first; the two cards settle in on
         the beat; the LEFT card flips on "which card", the mono choice label
         arcs over the hand on "you choose". Hero readable by t = 0.5s. */
      tl.fromTo("#f08-grid", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.05);
      tl.fromTo("#f08-table", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.2);
      tl.fromTo("#f08-halo-hand", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.out" }, 0.2);
      tl.fromTo("#f08-chromerule", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo(
        ["#f08-chromel", "#f08-chromer"],
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.07 },
        0.18
      );
      tl.fromTo(
        ["#f08-flip-l", "#f08-flip-r"],
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.09 },
        0.15
      );
      tl.fromTo(
        ["#f08-coin-1", "#f08-coin-2", "#f08-coin-3", "#f08-coin-4"],
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 },
        0.62
      );
      tl.fromTo("#f08-seatchip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.55);
      tl.fromTo("#f08-coincount", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.95);

      /* the beat: the loser's choice of reveal */
      tl.fromTo("#f08-flip-l", { rotationY: 180 }, { rotationY: 0, duration: 0.62, ease: "power3.out" }, 1.72);
      tl.fromTo("#f08-arcline", { strokeDashoffset: 620 }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.inOut" }, 1.95);
      tl.fromTo("#f08-arctxt", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.25);
      tl.fromTo("#f08-lbl-l", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.4);
      tl.fromTo(
        "#f08-stamp-l",
        { opacity: 0, scale: 1.5 },
        { opacity: 1, scale: 1, duration: 0.42, ease: LAND },
        2.42
      );
      /* discrete-text-sequence: the seat's card count swaps on the reveal */
      tl.set("#f08-seatchip", { textContent: "1 card" }, 2.44);
      tl.to("#f08-seatchip", { scale: 1.14, duration: 0.12, ease: "power2.out" }, 2.44);
      tl.to("#f08-seatchip", { scale: 1, duration: 0.2, ease: "power2.out" }, 2.56);

      /* "reveal as little as you can" — the other card stays down */
      tl.fromTo("#f08-lbl-r", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.1);

      /* ══ Scene 2 (3.4–8.9s) — double loss: two reveals from one turn ═════
         "A bad challenge plus a real attack can cost two lives in one turn."
         The challenge token slams in from the wing; the guerrilla execution
         token takes its place by scale-swap; the SECOND card flips on the
         beat and both lost lives land stamped orange. Tension peak. */
      tl.fromTo(
        "#f08-tok-a",
        { opacity: 0, x: -460, scale: 0.9 },
        { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "expo.out" },
        5.95
      );
      tl.to("#f08-tok-a", { scale: 0.68, opacity: 0, duration: 0.32, ease: "power2.in" }, 6.98);
      tl.fromTo(
        "#f08-tok-b",
        { opacity: 0, scale: 0.68, x: 34 },
        { opacity: 1, scale: 1, x: 0, duration: 0.55, ease: "back.out(1.8)" },
        7.18
      );
      tl.fromTo("#f08-tokchip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.72);
      tl.fromTo("#f08-flip-r", { rotationY: 180 }, { rotationY: 0, duration: 0.6, ease: "power3.out" }, 8.86);
      tl.set("#f08-lbl-r", { textContent: "revealed" }, 9.46);
      tl.set("#f08-seatchip", { textContent: "out" }, 9.46);
      tl.to("#f08-seatchip", { scale: 1.14, duration: 0.12, ease: "power2.out" }, 9.46);
      tl.to("#f08-seatchip", { scale: 1, duration: 0.2, ease: "power2.out" }, 9.58);
      tl.fromTo(
        "#f08-stamp-r",
        { opacity: 0, scale: 1.5 },
        { opacity: 1, scale: 1, duration: 0.42, ease: LAND },
        9.5
      );

      /* multi-phase-camera (push): a slow dolly onto the hand under the peak */
      tl.fromTo("#f08-hand", { scale: 1 }, { scale: 1.035, duration: DUR - 9.4, ease: "none" }, 9.4);

      /* ══ Scene 3 (9.4–14.1s) — out of cards: the payout and the survivor ═
         "Out of cards? Hand your coins to the Treasury."
         The treasury draws in on the question; the eliminated seat's four
         coins fly into it as the VO lands while count-up absorbs them and the
         seat counter resets; the surviving hand springs in beside it and
         holds on its single remaining face-down card. */
      tl.fromTo("#f08-trezbox", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 11.5);
      tl.fromTo(
        "#f08-trezinner",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power2.inOut" },
        11.5
      );
      tl.fromTo("#f08-trezlbl", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 11.85);
      tl.fromTo("#f08-dock", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 11.9);

      tl.fromTo(
        "#f08-surv",
        { opacity: 0, x: -140, scale: 0.86 },
        { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" },
        12.2
      );
      tl.fromTo("#f08-halo-surv", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 12.3);
      tl.fromTo("#f08-survlbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 12.75);

      /* the payout: four coins fly to the treasury, then the counter resets */
      var COINS = [
        { el: "#f08-coin-1", dx: 150, dy: 124 },
        { el: "#f08-coin-2", dx: 154, dy: 124 },
        { el: "#f08-coin-3", dx: 238, dy: 84 },
        { el: "#f08-coin-4", dx: 242, dy: 84 }
      ];
      COINS.forEach(function (coin, i) {
        var at = 12.45 + i * 0.085;
        tl.to(coin.el, { x: coin.dx * 0.5, y: -26, duration: 0.28, ease: "power1.out" }, at);
        tl.to(coin.el, { x: coin.dx, y: coin.dy, duration: 0.3, ease: "power1.in" }, at + 0.28);
        tl.to(coin.el, { scale: 1.22, duration: 0.09, ease: "power2.out" }, at + 0.58);
        tl.to(coin.el, { scale: 1, duration: 0.14, ease: "power2.out" }, at + 0.67);
      });
      tl.set("#f08-coincount", { textContent: "0 coins" }, 13.45);
      tl.to("#f08-coincount", { scale: 1.16, duration: 0.12, ease: "power2.out" }, 13.45);
      tl.to("#f08-coincount", { scale: 1, duration: 0.2, ease: "power2.out" }, 13.57);

      /* sine-wave-loop: the halo behind the hand breathes, so the held peak
         never sits dead. Deterministic — one sweep, pure function of time. */
      var halo = document.getElementById("f08-halo-hand");
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 4,
          duration: 10.5,
          ease: "none",
          onUpdate: function () {
            halo.style.opacity = (0.12 + Math.sin(phase.p) * 0.028).toFixed(4);
          }
        },
        1.8
      );

      /* no exit tween — the root transition owns the exit */

      tl.seek(0);
      window.__timelines["08-loss"] = tl;
    })();
  </script>
</template>
