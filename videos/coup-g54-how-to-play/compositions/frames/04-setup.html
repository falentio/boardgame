          <div data-hf-id="hf-lb5z" class="f04-rcface f04-rcback"><div data-hf-id="hf-4hcu" class="f04-rcseal"></div></div>
        </div>
      </div>
      <div data-hf-id="hf-1vsv" class="f04-rcname" id="f04-rcname-4" style="left: 1930px">peacekeeper</div>

      <!-- registry components, mounted as nested sub-compositions -->
      <div data-hf-id="hf-xlk3" class="clip f04-mount" id="f04-countmount" data-composition-id="count-up" data-composition-src="compositions/components/count-up.html" data-variable-values="{&quot;start&quot;:0,&quot;end&quot;:2,&quot;prefix&quot;:&quot;&quot;,&quot;suffix&quot;:&quot;&quot;,&quot;accent&quot;:&quot;green&quot;,&quot;glow&quot;:false,&quot;exit&quot;:&quot;none&quot;}" data-start="1.75" data-duration="2.5" data-track-index="2" data-width="1100" data-height="640"></div>
      <div data-hf-id="hf-ukpu" class="clip f04-mount" id="f04-deckmount" data-composition-id="spring-stack-shuffle" data-composition-src="compositions/components/spring-stack-shuffle.html" data-variable-values="{&quot;cards&quot;:5,&quot;cues&quot;:&quot;1.15, 1.6&quot;,&quot;accent&quot;:&quot;green&quot;,&quot;exit&quot;:&quot;none&quot;}" data-start="4.7" data-duration="2.55" data-track-index="2" data-width="440" data-height="600"></div>
    </div>

    <!-- track 3 — chrome + the Scene-4 stamp, fixed in frame -->
    <div data-hf-id="hf-kf43" class="clip f04-chrome" data-start="0" data-duration="16.777" data-track-index="3" id="f04-chrome">
      <div data-hf-id="hf-pijq" class="f04-chromerule" id="f04-chromerule"></div>
      <div data-hf-id="hf-amph" class="f04-chromel" id="f04-chromel">setup</div>
      <div data-hf-id="hf-bgzx" class="f04-chromer" id="f04-chromer">no. 04</div>
      <div data-hf-id="hf-o9nm" class="f04-stamprule" id="f04-stamprule"></div>
      <div data-hf-id="hf-ysxx" class="f04-stamp" id="f04-stamp">last winner starts · clockwise</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      var DURATION = 16.277;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Landing ease, taken from spring-stack-shuffle's own landEase: a
         zero-slope ballistic hang, ONE small sanctioned overshoot past the
         target, then a zero-slope settle. Pure function of progress, so any
         seek in either direction reproduces the same frame. */
      function landEase(overshoot) {
        return function (u) {
          if (u < 0.62) {
            var a = u / 0.62;
            return (1 + overshoot) * a * a * (3 - 2 * a);
          }
          var b = (u - 0.62) / 0.38;
          return 1 + overshoot - overshoot * b * b * (3 - 2 * b);
        };
      }
      var LAND = landEase(0.05);

      /* ── the camera — viewport-change PAN mode ───────────────────────────
         Single .world wrapper, one cam object as the single source of truth,
         one writer. World offset (ox, oy) lands at S*ox + x, so centring a
         station means x = -S * (stationX - 960). */
      var world = document.getElementById("f04-world");
      var cam = { scale: 0.8, x: -32, y: 0 };
      var drift = { p: 0 };
      var dAmp = { x: 5, y: 3 };
      function applyCamera() {
        var dx = Math.sin(drift.p) * dAmp.x;
        var dy = Math.sin(drift.p * 1.3) * dAmp.y;
        world.style.transform =
          "translate(" + (cam.x + dx).toFixed(2) + "px, " + (cam.y + dy).toFixed(2) + "px) scale(" +
          cam.scale.toFixed(4) + ")";
      }
      applyCamera();

      /* Scene 1 — wide establishing, then the slight push-in */
      tl.to(cam, { scale: 0.9, x: -36, duration: 1.1, ease: "power2.inOut", onUpdate: applyCamera }, 0.05);
      /* Scene 2 — pan to the Treasury station */
      tl.to(cam, { x: 580, scale: 1, duration: 0.65, ease: "power3.inOut", onUpdate: applyCamera }, 1.7);
      /* Scene 3 — pan to the Court deck, then to the role row */
      tl.to(cam, { x: -63, scale: 1.05, duration: 0.8, ease: "power3.inOut", onUpdate: applyCamera }, 4.25);
      tl.to(cam, { x: -735, duration: 1, ease: "power3.inOut", onUpdate: applyCamera }, 7.35);
      /* Scene 4 — settle back out for the full-table read */
      tl.to(cam, { x: -35, scale: 0.87, duration: 1.3, ease: "power2.inOut", onUpdate: applyCamera }, 12.9);

      /* multi-phase-camera: one sine breath over the whole shot, amplitude
         decayed to zero so the closing full-table read holds dead still. */
      tl.to(drift, { p: Math.PI * 2 * 1.35, duration: DURATION, ease: "none", onUpdate: applyCamera }, 0);
      tl.to(dAmp, { x: 0, y: 0, duration: 0.85, ease: "power2.inOut", onUpdate: applyCamera }, 12.95);

      /* ── Scene 1 (0.0–1.7s): the stage assembles ─────────────────────────
         spring-pop-entrance — scale grows into place with a long-tail
         settle, no overshoot. Hero (the table) is readable by t = 0.5s. */
      tl.fromTo("#f04-plane", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo("#f04-grid", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.08);
      tl.fromTo(
        ["#f04-chromerule", "#f04-chromel", "#f04-chromer"],
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.06 },
        0.2
      );
      tl.fromTo(
        ".f04-seat",
        { opacity: 0, scale: 0.96, y: 10 },
        { opacity: 0.45, scale: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 },
        0.25
      );
      tl.fromTo(
        ".f04-deckcard",
        { opacity: 0, scale: 0.94, y: 10 },
        { opacity: 0.55, scale: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 },
        0.45
      );
      tl.fromTo("#f04-plate", { opacity: 0, y: 12 }, { opacity: 0.6, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);
      tl.fromTo(
        ".f04-platecoin",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", stagger: 0.05 },
        0.62
      );
      tl.fromTo(".f04-rc", { opacity: 0, y: 12 }, { opacity: 0.4, y: 0, duration: 0.55, ease: "power3.out" }, 0.65);

      /* the count's coin-disc skin seats before the number does */
      tl.fromTo("#f04-coindisc", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.5);

      /* ── Scene 2 (2.15–4.25s): the Treasury ──────────────────────────────
         "two coins each" — the per-seat payout drops seat by seat, then the
         count lands and the Treasury plate takes the weight of "the rest". */
      tl.fromTo(
        ".f04-coin",
        {
          opacity: 0,
          y: -26,
          scale: 0.7,
          rotation: function (i) {
            return i % 2 ? 14 : -14;
          }
        },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.36, ease: LAND, stagger: 0.055 },
        2.15
      );
      tl.fromTo("#f04-herolabel", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.55);
      tl.to("#f04-plate", { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.2);
      tl.fromTo("#f04-treaslabel", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.25);
      tl.to(".f04-seat", { opacity: 0.9, duration: 0.5, ease: "power2.out" }, 3.3);

      /* counting-dynamic-scale: the component's own landing pulse, mirrored
         on the disc so the ring and the figure breathe as one beat. */
      tl.fromTo("#f04-coindisc", { scale: 1 }, { scale: 1.07, duration: 0.165, ease: "power3.out", immediateRender: false }, 3.47);
      tl.fromTo("#f04-coindisc", { scale: 1.07 }, { scale: 1, duration: 0.165, ease: "power2.out", immediateRender: false }, 3.635);

      /* ── Scene 3a (4.7–7.35s): the Court deck ────────────────────────────
         The registry stack shuffles, deals two cards out to the seat beneath
         it, and resettles under the weight; the rest of the table takes its
         cards during "the rest is the Court deck". */
      var DEX = 60;
      var DEY = -280;
      tl.fromTo(
        "#f04-deal-a",
        { opacity: 0, x: DEX, y: DEY, scale: 1.7, rotation: -10 },
        { opacity: 1, x: 34, y: -168, scale: 1.3, rotation: -4, duration: 0.22, ease: "power2.out" },
        5.1
      );
      tl.fromTo(
        "#f04-deal-a",
        { opacity: 1, x: 34, y: -168, scale: 1.3, rotation: -4 },
        { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: 0.48, ease: LAND, immediateRender: false },
        5.32
      );
      tl.fromTo(
        "#f04-deal-b",
        { opacity: 0, x: -DEX, y: DEY, scale: 1.7, rotation: 10 },
        { opacity: 1, x: -34, y: -168, scale: 1.3, rotation: 4, duration: 0.22, ease: "power2.out" },
        5.42
      );
      tl.fromTo(
        "#f04-deal-b",
        { opacity: 1, x: -34, y: -168, scale: 1.3, rotation: 4 },
        { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: 0.48, ease: LAND, immediateRender: false },
        5.64
      );
      /* compress-resettle: the deck takes the weight of each card leaving it */
      tl.fromTo("#f04-deckmount", { y: 0 }, { y: 8, duration: 0.18, ease: "power2.out", immediateRender: false }, 5.8);
      tl.fromTo("#f04-deckmount", { y: 8 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.98);

      /* the other seats take theirs — the hero deal keeps its own arc, so
         the cascade skips the two cards already in flight */
      tl.fromTo(
        ".f04-card:not(.f04-dealcard)",
        {
          opacity: 0,
          y: -42,
          scale: 0.92,
          rotation: function (i) {
            return i % 2 ? 9 : -9;
          }
        },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.4, ease: LAND, stagger: 0.065 },
        5.55
      );
      tl.fromTo(
        "#f04-decklabel",
        { opacity: 0, scale: 0.9, y: 6 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.25
      );

      /* ── Scene 3b (7.4–12.9s): the starter set ───────────────────────────
         The row firms up as the camera arrives, then each role card flips
         face-up on its spoken name. */
      tl.to(".f04-rc", { opacity: 0.92, duration: 0.35, ease: "power2.out" }, 7.4);
      tl.fromTo(
        "#f04-starterlabel",
        { opacity: 0, scale: 0.9, y: 10 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        8.45
      );

      var FLIP_AT = [9.9, 10.35, 11.0, 11.55, 12.35];
      FLIP_AT.forEach(function (t, i) {
        tl.fromTo("#f04-flip-" + i, { rotationY: 180 }, { rotationY: 0, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo(
          "#f04-rcname-" + i,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          t + 0.14
        );
      });

      /* ── Scene 4 (12.9–16.277s): the full-table read, held ───────────────
         Camera settles out, the breath decays to nothing, and the seat order
         plus the turn rule stamp in. Deliberate stillness after that. */
      tl.to(".f04-seat", { opacity: 1, duration: 0.5, ease: "power2.out" }, 12.95);
      tl.fromTo(
        ".f04-seatnum",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", stagger: 0.06 },
        13.85
      );
      tl.fromTo("#f04-stamprule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 13.75);
      tl.fromTo("#f04-stamp", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 13.95);

      /* no exit tween — the root transition owns the exit */

      tl.seek(0);
      window.__timelines["04-setup"] = tl;
    })();
  </script>
