      tl.fromTo("#f07-grid", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" }, 0.05);
      tl.fromTo("#f07-axis", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" }, 0.15);
      tl.fromTo("#f07-chromerule", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo(
        ["#f07-chromel", "#f07-chromer"],
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.07 },
        0.18
      );

      /* split-tilt-cards, the signature move — left wing first, mirrored
         book-open rotateY (+14 left, −14 right) with the outward entry x */
      tl.fromTo(
        "#f07-panel-l",
        { opacity: 0, x: -360, rotateY: 22, scale: 0.85 },
        { opacity: 1, x: 0, rotateY: 14, scale: 1, duration: 0.75, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#f07-panel-l .f07-copy",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.07 },
        0.5
      );
      tl.fromTo(
        "#f07-card-l",
        { opacity: 0, y: 20, scale: 0.96, rotation: -5 },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        0.8
      );
      tl.fromTo(
        "#f07-chip-l",
        { opacity: 0, scale: 0, y: 10 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: POP },
        1.2
      );

      /* ambient-glow-bloom — the left wing's halo lands on the panel settle */
      var GLOW = 0.16;
      tl.fromTo(
        "#f07-glow-l",
        { opacity: 0, scale: 0.8 },
        { opacity: GLOW, scale: 1, duration: 0.9, ease: "power2.out" },
        0.45
      );

      /* the count-up sub-composition owns its own arrival, its count (0 → 4
         over 1.72s) and its landing pulse; it mounts at t = 1.05, lands at
         ≈ 2.8 inside Scene 1, then holds its value untouched for the rest of
         the shot — which is the whole point of the sunk-cost beat. */

      /* the attack fires out across the gutter, chevron into the target wing */
      tl.fromTo("#f07-atal", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 2.5);
      tl.fromTo("#f07-atar", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 2.62);
      tl.fromTo("#f07-chev", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.02);

      /* ══ Scene 2 (3.0–7.2s) — the target answers, mirrored ──────────────
         "Blocks are claims too — they can be lies. And in G54, force roles
         block themselves: Guerrilla blocks Guerrilla."
         The blocker panel tilts in from the right wing ~0.2s behind the left
         entry, its claim chip lands at the inner edge and gets encircled, the
         mono stamp reads the catch, and the bridge label names the pair. */
      tl.fromTo(
        "#f07-panel-r",
        { opacity: 0, x: 360, rotateY: -22, scale: 0.85 },
        { opacity: 1, x: 0, rotateY: -14, scale: 1, duration: 0.75, ease: "power3.out" },
        3.55
      );
      tl.fromTo(
        "#f07-panel-r .f07-copy",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.07 },
        3.8
      );
      tl.fromTo(
        "#f07-glow-r",
        { opacity: 0, scale: 0.8 },
        { opacity: GLOW, scale: 1, duration: 0.9, ease: "power2.out" },
        3.8
      );
      tl.fromTo(
        "#f07-card-r",
        { opacity: 0, y: 20, scale: 0.96, rotation: 5 },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        4.15
      );
      tl.fromTo(
        "#f07-chip-r",
        { opacity: 0, scale: 0, y: 10 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: POP },
        4.45
      );

      /* css-marker-patterns, circle mode — the hand-drawn ellipse closes
         around the target's claim, then the mono stamp reads under it */
      tl.fromTo(
        "#f07-ring",
        { opacity: 0, scale: 0, rotation: 10 },
        { opacity: 1, scale: 1, rotation: -3, duration: 0.6, ease: "back.out(1.7)" },
        4.7
      );
      tl.fromTo(
        ["#f07-stamp-1", "#f07-stamp-2"],
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 },
        4.95
      );

      /* the bridge label — guerrilla blocks guerrilla, the second guerrilla
         in the sole accent — with a hairline bracket drawing out each side */
      tl.fromTo(
        "#f07-bridge",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.3
      );
      tl.fromTo(
        ["#f07-brule-l", "#f07-brule-r"],
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.08 },
        5.4
      );

      /* ══ Scene 3 (7.2–14.549s) — the block resolves, the cost stands ─────
         "A blocked attack still costs the attacker their coins."
         The attack hairline snaps in two, the pair settles back, four
         hairlines close around the landed four, the sunk label rises, and
         neither card ever turns. Then hold the still pair. */
      tl.to("#f07-atal", { x: -26, rotation: -7, opacity: 0.45, duration: 0.32, ease: "power3.in" }, 7.35);
      tl.to("#f07-atar", { x: 26, rotation: 7, opacity: 0.45, duration: 0.32, ease: "power3.in" }, 7.35);
      tl.to("#f07-chev", { opacity: 0, y: 12, duration: 0.3, ease: "power3.in" }, 7.35);

      tl.to([".f07-panel", ".f07-chip"], { opacity: 0.86, duration: 0.5, ease: "power2.out" }, 7.55);

      tl.fromTo(
        ["#f07-lock-t", "#f07-lock-r", "#f07-lock-b", "#f07-lock-l"],
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", stagger: 0.07 },
        7.75
      );
      tl.fromTo(
        "#f07-sunk",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        8.3
      );
      tl.fromTo(
        ["#f07-tag-l", "#f07-tag-r"],
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 },
        8.7
      );

      /* one quiet re-pulse on the circle — the claim is still a claim */
      tl.to("#f07-ring", { scale: 1.035, duration: 0.22, ease: "power2.out" }, 9.4);
      tl.to("#f07-ring", { scale: 1, duration: 0.22, ease: "power2.in" }, 9.62);

      /* the asymmetric outcome, one note under each wing */
      tl.fromTo(
        ["#f07-note-l", "#f07-note-r"],
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.16 },
        11.4
      );

      /* ══ hold — sine-wave-loop, the low register only ════════════════════
         Counter-phase jitter on the mirrored pair (left down, right up) so
         they never conveyor-belt. Runs out at ~14.4s, leaving the closing
         read dead still. */
      tl.to("#f07-panel-l", { y: -3, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.6);
      tl.to("#f07-panel-r", { y: 3, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.6);

      var AMP = 0.014; /* default / √2 for two concurrent halos */
      var glowLPhase = { p: 0 };
      var glowRPhase = { p: 0 };
      var glowL = document.getElementById("f07-glow-l");
      var glowR = document.getElementById("f07-glow-r");
      tl.to(
        glowLPhase,
        {
          p: Math.PI * 4,
          duration: 8,
          ease: "none",
          onUpdate: function () {
            glowL.style.opacity = String(GLOW + Math.sin(glowLPhase.p) * AMP);
          }
        },
        4.8
      );
      tl.to(
        glowRPhase,
        {
          p: Math.PI * 4,
          duration: 9,
          ease: "none",
          onUpdate: function () {
            glowR.style.opacity = String(GLOW + Math.sin(glowRPhase.p) * AMP);
          }
        },
        5.2
      );

      /* no exit tween — the root transition owns the exit */

      tl.seek(0);
      window.__timelines["07-blocks"] = tl;
    })();
  </script>
