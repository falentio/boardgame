        { t: 4.9, num: "1", cat: "communications" },
        { t: 6.3, num: "1", cat: "force" },
        { t: 7.7, num: "2", cat: "special interest" }
      ];
      var STAMP_DUR = 0.22;
      var PULSE_UP = 0.16;
      var PULSE_DOWN = 0.28;
      var PULSE_AMP = 0.05;
      var FINAL_T = STATES[STATES.length - 1].t;

      var countEl = document.getElementById("f03-count");

      function easeOut3(u) {

          "#f03-chrome-right",
          "#f03-hair-top",
          "#f03-hair-bottom",
          "#f03-pips",
          "#f03-count",
          "#f03-stub",
          "#f03-public",
          ".f03-tile",
          ".f03-tile-bar"
        ],
        { opacity: 0 },
        0
      );
      tl.set("#f03-stub", { scaleX: 0 }, 0);
      tl.set(".f03-tile", { y: 0, scale: 1, rotationY: 0 }, 0);
      tl.set(".f03-tile-bar", { backgroundColor: BORDER, scaleX: 1 }, 0);
      tl.set("#f03-anchor", { opacity: 0, scale: 1, y: 0 }, 0);
      tl.set("#f03-n5", { scale: 1 }, 0);

      /* ── Scene 1 (0.0–3.2): the anchor lands and PINS ──────────────────
         It never moves again. The push-in runs underneath it. ─────────── */
      tl.fromTo(
        "#f03-anchor",
        { opacity: 0, scale: 0.9, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: 0.46, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#f03-chrome-rule",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.inOut" },
        0.12
      );
      tl.fromTo(
        ["#f03-chrome-left", "#f03-chrome-right"],
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        0.35
      );

      /* the rule strip's structure arrives before the rule itself does */
      tl.fromTo(
        ["#f03-hair-top", "#f03-hair-bottom"],
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.inOut" },
        1.5
      );
      tl.fromTo(
        ["#f03-pips", "#f03-count"],
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power1.out" },
        1.85
      );
      tl.fromTo(
        "#f03-stub",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" },
        2.6
      );

      /* ── Scene 2 (3.2–8.0): the world cycles, the anchor holds (camera push is authored above) ────────── */

      /* "but every game uses only five" — the five illuminates */
      tl.fromTo(
        "#f03-n5",
        { color: "#505048" },
        { color: "#e85d26", duration: 0.24, ease: "power2.out" },
        3.9
      );
      tl.fromTo("#f03-n5", { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power2.out" }, 3.9);
      tl.fromTo(
        "#f03-n5",
        { scale: 1.07 },
        { scale: 1, duration: 0.26, ease: "power2.inOut", immediateRender: false },
        4.04
      );

      /* the four states, their stub re-stamps and their pips are all derived
         inside paintStrip above — instant text, no smear between states. */

      /* ── Scene 3 (8.0–12.0): the five land face up, public (camera phase three already runs) ────────────── */

      var tiles = document.querySelectorAll(".f03-tile");
      for (var i = 0; i < tiles.length; i++) {
        var posX = i * 324;
        gsap.set(tiles[i], { x: posX });

        tl.fromTo(
          tiles[i],
          { opacity: 0, y: 28, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
          8.2 + i * 0.16
        );

        /* flip face-up: the back face carries the silhouette, the front face
           the public role. The bar colour snaps while the tile is edge-on. */
        var flipAt = 9.0 + i * 0.28;
        tl.fromTo(
          tiles[i],
          { rotationY: 0 },
          { rotationY: 180, duration: 0.52, ease: "power2.inOut", immediateRender: false },
          flipAt
        );
        var barEl = tiles[i].querySelector(".f03-tile-bar");
        tl.set(barEl, { backgroundColor: ORANGE }, flipAt + 0.26);
      }

      /* "face up · public · all game" lands on its cue, the row holds still */
      tl.fromTo(
        "#f03-public",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        11.7
      );

      /* last quiet beat: all five bars re-stamp — public, confirmed */
      for (var b = 0; b < tiles.length; b++) {
        var bar = tiles[b].querySelector(".f03-tile-bar");
        tl.fromTo(
          bar,
          { scaleX: 0.3 },
          { scaleX: 1, duration: 0.2, ease: "power3.out", immediateRender: false },
          13.2 + b * 0.06
        );
      }

      /* hold to the cut — no exit: the root transition owns it. */

      tl.seek(0);
      window.__timelines["03-role-twist"] = tl;
    })();
  </script>
</template>
