        { opacity: 1, x: 0, rotation: 0, duration: 0.75, ease: "power3.out" },
        2.3
      );
      tl.fromTo(
        "#f05-a-kicker",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        2.5
      );
      tl.fromTo(
        "#f05-a-word",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.62
      );
      /* lands with the count-up's own landing pulse (its internal t ≈ 4.0) */
      tl.fromTo(
        "#f05-a-chip",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" },
        4.0
      );

      /* ── Scene 3 (5.6–9.0): slot B — claim a role. scale-swap from slot A:
         outgoing rushes away on power2.in, incoming overshoots on back.out,
         both on the same footprint so it reads as one morph. ───────────── */
      tl.to(
        "#f05-slot-a",
        { scale: 0.8, opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false },
        5.6
      );
      tl.to(
        ["#f05-a-chip", "#f05-coindisc"],
        { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
        5.6
      );

      tl.fromTo(
        "#f05-slot-b",
        { opacity: 0, scale: 0.78 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" },
        5.85
      );
      tl.fromTo(
        "#f05-b-kicker",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.0
      );
      tl.fromTo(
        "#f05-b-word",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.12
      );
      tl.fromTo(
        "#f05-b-card",
        { opacity: 0, x: 200 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        6.3
      );
      tl.fromTo(
        "#f05-b-chip",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" },
        6.85
      );
      /* "no proof needed" — the stamp lands once and pulses once, then holds */
      tl.fromTo(
        "#f05-b-stamp",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" },
        7.78
      );
      tl.to(
        "#f05-b-stamp",
        { scale: 1.16, duration: 0.16, ease: "power2.out", immediateRender: false },
        8.18
      );
      tl.to(
        "#f05-b-stamp",
        { scale: 1, duration: 0.32, ease: "power2.inOut", immediateRender: false },
        8.34
      );

      /* ── Scene 4 (9.0–12.0): slot C — the clock runs out. The divider wipes
         open so the strip goes full width, the bank climbs to ten with the
         numeral growing as it goes, then "coup" slams on the beat. ─────── */
      tl.to(
        "#f05-divider",
        { scaleY: 0, duration: 0.35, ease: "power2.in", immediateRender: false },
        9.0
      );
      tl.to(
        "#f05-slot-b",
        { scale: 0.8, opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false },
        9.0
      );
      tl.fromTo(
        "#f05-slot-c",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" },
        9.25
      );

      /* counting-dynamic-scale: one count, one scale tween, same ease and
         position — the value climbs while the numeral gains weight. */
      var COUNT_DUR = 1.6;
      var bankEl = document.getElementById("f05-c-bank");
      var bank = { value: 1 };
      tl.fromTo(
        "#f05-c-bank",
        { scale: 0.5 },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        9.25
      );
      tl.to(
        bank,
        {
          value: 10,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            bankEl.textContent = Math.round(bank.value);
          }
        },
        9.25
      );

      /* the headline steps back so the coup owns the finale */
      tl.to(
        "#f05-headline",
        { scale: 0.9, duration: 0.6, ease: "power2.inOut", immediateRender: false },
        10.9
      );

      /* on the beat — the counter has just hit ten */
      tl.fromTo(
        "#f05-c-kicker",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        9.45
      );
      tl.fromTo(
        "#f05-c-note",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        9.45
      );
      /* the clock turns hot the instant the count lands */
      tl.to(bankEl, { color: ORANGE, duration: 0.24, ease: "power2.out" }, 10.85);
      tl.fromTo(
        "#f05-c-word",
        { opacity: 0, scale: 1.45, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
        10.85
      );
      tl.fromTo(
        "#f05-c-stamp",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" },
        11.0
      );
      /* one life gone: the target seat flips face-up and holds */
      tl.fromTo(
        "#f05-c-card",
        { rotationY: 180, opacity: 0 },
        { rotationY: 0, opacity: 1, duration: 0.52, ease: "power2.inOut" },
        11.2
      );
      tl.fromTo(
        "#f05-c-gone",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        11.7
      );
      /* quiet settle — the strip lands and holds to the cut */
      tl.to(
        "#f05-slot-c",
        { scale: 0.985, duration: 0.5, ease: "sine.inOut", immediateRender: false },
        11.9
      );

      /* hold to the cut — no exit: the root transition owns it. */

      paintCamera();
      tl.seek(0);
      window.__timelines["05-turn"] = tl;
    })();
  </script>
</template>
