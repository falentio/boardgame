          <div data-hf-id="hf-d6k4" class="f06-pface f06-pfront">
            <div data-hf-id="hf-cn37" class="f06-pidx">no. 02</div>
            <div data-hf-id="hf-xhk2" class="f06-pname">director</div>

    <!-- track 5 — chrome and the claim, fixed in frame -->
    <div data-hf-id="hf-7u2r" class="clip f06-chrome" data-start="0" data-duration="15.839" data-track-index="5" id="f06-chrome">
      <div data-hf-id="hf-7z8e" class="f06-chromerule" id="f06-chromerule"></div>
      <div data-hf-id="hf-3p10" class="f06-chromel" id="f06-chromel">coup · rebellion g54</div>
      <div data-hf-id="hf-axw7" class="f06-chromer" id="f06-chromer">no. 06</div>
      <div data-hf-id="hf-i2a4" class="f06-claim" id="f06-claim">
        <span data-hf-id="hf-ls7t" class="f06-claimk">claim:</span><span data-hf-id="hf-sglm" class="f06-claimv">director</span>
      </div>
      <div data-hf-id="hf-isqx" class="f06-anyone" id="f06-anyone"><b data-hf-id="hf-x3pa">/</b> challenge window</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Landing ease borrowed from spring-stack-shuffle's own landEase: a
         zero-slope hang, ONE small sanctioned overshoot past the target, then
         a zero-slope settle. Pure function of progress, so any seek in either
         direction reproduces the same frame. */
      function landEase(overshoot) {
        return function (u) {
          if (u < 0.62) {
            var a = u / 0.62;
            return (1 + overshoot) * a * a * (3 - 2 * a);
          }
          var b = (u - 0.62) / 0.38;
          return 1 + overshoot - overshoot * b * b * (3 - 2 * b);
        };
      }
      var POP = landEase(0.06);
      var STAMP = landEase(0.08);

      /* ══ Scene 1 (0.0–3.0s) — the claim, then the window opens ═══════════
         "Anyone can challenge any claim — even someone not involved."
         The claim chip pills in and settles down from above (gsap-effects:
         translate + opacity on a long-tail power3), forming a T against the
         panels that arrive from the wings next. Hero readable by t = 0.5s. */
      tl.fromTo(
        "#f06-grid",
        { opacity: 0 },
        { opacity: 1, duration: 1, ease: "power2.out" },
        0.05
      );
      tl.fromTo("#f06-axis", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" }, 0.15);
      tl.fromTo("#f06-chromerule", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo(
        ["#f06-chromel", "#f06-chromer"],
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.07 },
        0.18
      );
      tl.fromTo(
        "#f06-claim",
        { opacity: 0, scale: 0.92, y: -18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.08
      );
      tl.fromTo("#f06-anyone", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.55);

      /* the challenge window — one beat, then settle */
      tl.fromTo("#f06-wrect", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.9);
      tl.fromTo(
        ".f06-brk",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", stagger: 0.07 },
        0.98
      );

      /* ══ Scene 2 (3.0–7.2s) — split-tilt-cards, the signature move ═══════
         Two equal-weight panels arrive from opposite wings with a mirrored
         book-open rotateY, the right ~0.25s behind; copy fades up during the
         settle, never after. */
      tl.fromTo(
        "#f06-panel-l",
        { opacity: 0, x: -360, rotateY: 22, scale: 0.85 },
        { opacity: 1, x: 0, rotateY: 14, scale: 1, duration: 0.75, ease: "power3.out" },
        3.05
      );
      tl.fromTo(
        "#f06-panel-r",
        { opacity: 0, x: 360, rotateY: -22, scale: 0.85 },
        { opacity: 1, x: 0, rotateY: -14, scale: 1, duration: 0.75, ease: "power3.out" },
        3.3
      );
      tl.fromTo(
        "#f06-panel-l .f06-pcopy",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.07 },
        3.45
      );
      tl.fromTo(
        "#f06-panel-r .f06-pcopy",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.07 },
        3.7
      );

      /* ambient-glow-bloom — one halo per wing, landing on the panels' settle */
      var GLOW = 0.16;
      tl.fromTo(
        "#f06-glow-l",
        { opacity: 0, scale: 0.8 },
        { opacity: GLOW, scale: 1, duration: 0.9, ease: "power2.out" },
        3.55
      );
      tl.fromTo(
        "#f06-glow-r",
        { opacity: 0, scale: 0.8 },
        { opacity: GLOW, scale: 1, duration: 0.9, ease: "power2.out" },
        3.85
      );

      /* left outcome — "Catch a bluff: the claimant loses a life." */
      tl.fromTo("#f06-flip-l", { rotationY: 180 }, { rotationY: 0, duration: 0.55, ease: "power3.out" }, 4.15);
      tl.fromTo(
        "#f06-stamp-l",
        { opacity: 0, scale: 0, rotation: -12 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: STAMP },
        4.6
      );
      tl.fromTo(
        "#f06-badge-l",
        { opacity: 0, scale: 0, y: 10 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: POP },
        5.05
      );

      /* right outcome — "Wrong call: you lose one instead." */
      tl.fromTo("#f06-flip-r", { rotationY: 180 }, { rotationY: 0, duration: 0.55, ease: "power3.out" }, 6.15);
      tl.fromTo(
        "#f06-stamp-r",
        { opacity: 0, scale: 0, rotation: 12 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: STAMP },
        6.55
      );
      tl.fromTo(
        "#f06-badge-r",
        { opacity: 0, scale: 0, y: 10 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: POP },
        6.95
      );

      /* ══ Scene 3 (7.2–11.0s) — the court shuffle ═════════════════════════
         "Truth proven: the card flips back into the Court, and a fresh one
         replaces it. Still hidden."
         The panels settle into the background, the proven card takes the
         deck's front slot, shows itself once, flips back in, and the mounted
         spring-stack-shuffle throws a fresh card over the top at 9.75. */
      tl.to([".f06-panel", ".f06-badge"], { opacity: 0.82, duration: 0.5, ease: "power2.out" }, 7.35);

      tl.fromTo("#f06-proven", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 8);
      tl.fromTo(
        "#f06-provenflip",
        { rotationY: 180 },
        { rotationY: 0, duration: 0.45, ease: "power3.out" },
        8.3
      );
      tl.fromTo(
        "#f06-provenflip",
        { rotationY: 0 },
        { rotationY: 180, duration: 0.45, ease: "power3.inOut", immediateRender: false },
        9.15
      );
      /* it is face-down again, sitting as the deck's front card — the mount's
         own front card takes over from here, so the hand-off is invisible */
      tl.set("#f06-proven", { opacity: 0 }, 9.62);

      /* the detail everyone forgets, in the sole accent */
      tl.fromTo(
        "#f06-hiddenrule",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" },
        10.8
      );
      tl.fromTo(
        "#f06-hidden",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        10.9
      );

      /* ══ hold — sine-wave-loop, the low register only ════════════════════
         Counter-phase jitter on the mirrored pair (left sin, right sin+π) so
         they never conveyor-belt, and two halo breathes on staggered periods.
         Both run out at ~13.8s, leaving the closing read dead still. */
      tl.to("#f06-panel-l", { y: -3, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.4);
      tl.to("#f06-panel-r", { y: 3, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.4);

      var AMP = 0.014; /* default / √2 for two concurrent halos */
      var glowLPhase = { p: 0 };
      var glowRPhase = { p: 0 };
      var glowL = document.getElementById("f06-glow-l");
      var glowR = document.getElementById("f06-glow-r");
      tl.to(
        glowLPhase,
        {
          p: Math.PI * 4,
          duration: 8,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(glowLPhase.p);
            glowL.style.opacity = String(GLOW + s * AMP);
          }
        },
        4.8
      );
      tl.to(
        glowRPhase,
        {
          p: Math.PI * 4,
          duration: 9,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(glowRPhase.p);
            glowR.style.opacity = String(GLOW + s * AMP);
          }
        },
        4.8
      );

      /* no exit tween — the root transition owns the exit */

      tl.seek(0);
      window.__timelines["06-challenge"] = tl;
    })();
  </script>
