  <script>
    (function () {
      var DURATION = 3.349;
      var tl = gsap.timeline({ paused: true });

      /* The blank card seats on the portrait hero anchor (centre y ≈ 806) with
         the claimant's own card beneath it. The verdict's crash drives that whole
         stack UP out of its way — ticker-takeover's "the hero physically shoves
         the text group aside", rotated onto the vertical axis. */
      var SHOVE_PX = 300;
      /* the claimant's coins sit out on the table, below the treasury, until the
         verdict sends them back up into its slots */
      var COIN_PX = 560;

      /* ── collapsed start states pinned at t=0 — seek-safe, so a delayed
         entrance never flashes its CSS-default (visible) state before its
         tween claims it ────────────────────────────────────────────────── */
      tl.set(
        [
          "#f08-stamp",
          "#f08-kicker",
          "#f08-num",
          "#f08-tray",
          "#f08-tray-label",
          "#f08-tagA",
          "#f08-influence",
          "#f08-hero",
          "#f08-cardA-pos",
          "#f08-cardB-pos",
          "#f08-coinA",
          "#f08-coinB",
          "#f08-coinC"
        ],
        { opacity: 0 },
        0
      );
      tl.set(["#f08-rule", "#f08-redact"], { scaleX: 0 }, 0);
      tl.set("#f08-field-accent", { scale: 0.84, opacity: 0 }, 0);
      tl.set(["#f08-coinA", "#f08-coinB", "#f08-coinC"], { y: COIN_PX }, 0);

      /* ══ one tempo grid drives every slam (kinetic-beat-slam) ═══════════ */
      var PULSE = 0.4;
      var BEATS = [PULSE * 0.15, PULSE * 2.4, PULSE * 5.5]; /* 0.06 · 0.96 · 2.20 */

      /* ══ Scene 1 (0.0–0.96) — the same stamp lands, the field flips register ══ */

      /* the challenge stamp — scale + blur slam, hard attack */
      tl.fromTo(
        "#f08-stamp",
        { scale: 1.62, filter: "blur(16px)", opacity: 0, y: -22 },
        { scale: 1, filter: "blur(0px)", opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
        BEATS[0]
      );

      /* the field hard-cuts to the accent register — scale-swap-transition: the
         incoming accent ground pops over the dark ground (the outgoing dark ground
         stays full-bleed beneath, covered, so no host background leaks at the
         edges mid-swap) */
      tl.fromTo(
        "#f08-field-accent",
        { scale: 0.84, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" },
        BEATS[0] + 0.04
      );

      /* the same stamp, now read on the accent register — ink-on-fire is absolute */
      tl.to(
        "#f08-stamp-mark",
        { color: "#273136", borderColor: "rgba(39,49,54,0.45)", duration: 0.3, ease: "power2.inOut" },
        BEATS[0] + 0.16
      );

      /* ink-on-accent chrome rides the flip */
      tl.fromTo("#f08-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.34);
      tl.fromTo(
        "#f08-kicker",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
        0.4
      );
      tl.fromTo(
        "#f08-num",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
        0.46
      );

      /* the empty treasury takes its place high on the right */
      tl.fromTo(
        "#f08-tray",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
        0.52
      );
      tl.fromTo(
        "#f08-tray-label",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
        0.56
      );

      /* the revealed card is blank — the focal: smooth long-tail settle, no overshoot */
      tl.fromTo(
        "#f08-cardA-pos",
        { scale: 0.62, opacity: 0, y: 90 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.3
      );
      /* the claimant's own card seats directly beneath it, face-down */
      tl.fromTo(
        "#f08-cardB-pos",
        { scale: 0.62, opacity: 0, y: 90 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.58
      );

      /* the redaction bar sweeps across the blank face */
      tl.fromTo(
        "#f08-redact",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.46, ease: "power2.inOut" },
        0.72
      );
      tl.fromTo(
        "#f08-tagA",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.84
      );

      /* the claimant's coins come into view on the table, still out of the treasury */
      tl.to(
        ["#f08-coinA", "#f08-coinB", "#f08-coinC"],
        { opacity: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" },
        0.9
      );

      /* ══ Scene 2 (0.96–2.20) — the claimant's own card turns face-up ══ */

      /* split-tilt-cards: the rotateY flip, under the pos wrapper's perspective */
      tl.fromTo(
        "#f08-cardB",
        { rotateY: 0 },
        { rotateY: 180, duration: 0.66, ease: "power3.inOut" },
        BEATS[1]
      );

      /* -1 influence — the life goes */
      tl.fromTo(
        "#f08-influence",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.4
      );

      /* the spent card dims — the life is gone */
      tl.to("#f08-cardB", { opacity: 0.42, duration: 0.5, ease: "power2.out" }, 1.72);

      /* ══ Scene 3 (2.20–2.96) — the verdict crashes in, the coins go home ══ */

      var CRASH_AT = BEATS[2];
      var CRASH_DUR = 0.7;
      var VICTIM_DUR = CRASH_DUR * 0.42; /* the struck stack reacts inside the driver window */

      /* the verdict crashes in from off-screen ABOVE with a heavy long-tail settle —
         ticker-takeover: mass, not zip. (Above, not below, so the in-flight hero
         never crosses the caption keep-out band at y ≥ 1600.) */
      tl.fromTo(
        "#f08-hero",
        { y: -760, scale: 0.96 },
        { y: 0, scale: 1, duration: CRASH_DUR, ease: "power2.out" },
        CRASH_AT
      );
      tl.fromTo(
        "#f08-hero",
        { opacity: 0 },
        { opacity: 1, duration: 0.18, ease: "none" },
        CRASH_AT
      );

      /* directional streak blur — the SAME window + ease, resolving sharp at the land.
         Seek-safe form: tween the SVG attribute directly (an onUpdate writer would
         freeze under the renderer's suppressed-event seek). */
      var blurNode = document.getElementById("f08-streak-blur");
      tl.fromTo(
        blurNode,
        { attr: { stdDeviation: "0 26" } },
        { attr: { stdDeviation: "0 0" }, duration: CRASH_DUR, ease: "power2.out" },
        CRASH_AT
      );

      /* reactive-displacement: the struck stack is driven UP out of the hero's way
         inside the same driver window, completing at 42% so the hit reads causal,
         not parallel */
      tl.fromTo(
        "#f08-cardA-pos",
        { y: 0 },
        { y: -SHOVE_PX, duration: VICTIM_DUR, ease: "power2.out" },
        CRASH_AT
      );
      tl.fromTo(
        "#f08-cardB-pos",
        { y: 0 },
        { y: -SHOVE_PX, duration: VICTIM_DUR, ease: "power2.out" },
        CRASH_AT
      );
      tl.fromTo(
        "#f08-influence",
        { y: 0 },
        { y: -SHOVE_PX, duration: VICTIM_DUR, ease: "power2.out" },
        CRASH_AT
      );

      /* the three coins slide back UP into the mk-orange treasury */
      ["#f08-coinA", "#f08-coinB", "#f08-coinC"].forEach(function (id, i) {
        tl.fromTo(
          id,
          { y: COIN_PX },
          { y: 0, duration: 0.5, ease: "power3.out" },
          2.32 + i * 0.08
        );
      });

      /* ══ Scene 4 (3.00–3.349) — the accent field holds, deliberate held read ══ */

      /* sine-wave-loop, low-amplitude jitter on the settled hero. sin(0) = 0 at
         IDLE_START, so there is no jump off the crash's settle tail. Seek-safe form:
         pre-sampled keyframes, never an onUpdate writer. */
      var IDLE_START = 3.0;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 0.22;
      var IDLE_STEPS = 16;
      var heroEl = document.getElementById("f08-hero");
      var idleFrames = [];
      for (var si = 0; si <= IDLE_STEPS; si++) {
        var s = Math.sin((si / IDLE_STEPS) * Math.PI * 2 * CYCLES);
        idleFrames.push({ y: s * 1.6, scale: 1 + s * 0.008 });
      }
      tl.to(heroEl, { keyframes: idleFrames, duration: IDLE_DUR, ease: "none" }, IDLE_START);

      window.__timelines["08-if-youre-lying"] = tl;
    })();
