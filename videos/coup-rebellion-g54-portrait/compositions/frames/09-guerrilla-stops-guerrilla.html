<script>
  (function () {

    var arcPath = document.querySelector(".gsg-arc path");
    var arcLen = 0;
    if (arcPath && arcPath.getTotalLength) {
      arcLen = arcPath.getTotalLength() * 1.02; // slight overestimate: too large is invisible, too small clips
      arcPath.style.strokeDasharray = String(arcLen);
      arcPath.style.strokeDashoffset = String(arcLen);

    // ---- collapsed from-states, stated explicitly at t=0 (seek-safe, no CSS-hidden start) ----
    tl.set(".gsg-grid", { opacity: 0 }, 0);
    tl.set(".gsg-vignette", { opacity: 0 }, 0);
    tl.set(".gsg-toprule", { scaleX: 0 }, 0);

    tl.set(".gsg-card-up .gsg-tag", { opacity: 0, y: -12 }, 0);
    tl.set(".gsg-card-up .gsg-word", { opacity: 0, y: -18 }, 0);
    tl.set(".gsg-card-up .gsg-stub", { scaleX: 0 }, 0);
    tl.set(".gsg-card-low", { y: 80, scale: 0.92, opacity: 0 }, 0);
    tl.set(".gsg-card-low .gsg-tag", { opacity: 0, y: 12 }, 0);
    tl.set(".gsg-card-low .gsg-word", { opacity: 0, y: 18 }, 0);

    tl.set(".gsg-chip-attack", { y: -40, scale: 0.9, opacity: 0 }, 0);

    tl.set(".gsg-ruleblock", { opacity: 0, y: 16 }, 0);

    /* ============ SCENE 1 (0.0-2.2s) — the anchor lands and PINS ============

    tl.fromTo(".gsg-bg", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

    tl.fromTo(".gsg-num", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.42);

    // spring-pop-entrance — smooth long-tail settle (power3, no overshoot) + slide-up

      ".gsg-card-low",
      { scale: 0.92, opacity: 0, y: 80 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.0

    tl.fromTo(".gsg-card-low .gsg-tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.22);
    tl.fromTo(".gsg-card-low .gsg-word", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.32);
    tl.fromTo(".gsg-card-low .gsg-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.62);

    /* ============ SCENE 2 (2.2-4.0s) — the identical blocker drops in ============
       VO "each Force role blocks only itself" -> the same card arrives from ABOVE and seats
       facing the anchor. The repetition is the argument. */
    tl.fromTo(
      ".gsg-card-up",
      { y: -170, scale: 0.94, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
      2.65

    tl.fromTo(".gsg-card-up .gsg-tag", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.25);
    tl.fromTo(".gsg-card-up .gsg-word", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.38);
    tl.fromTo(".gsg-card-up .gsg-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 3.55);

    /* ============ SCENE 3 (4.0-6.2s) — the arc snaps, the attack collapses ============
       VO "Guerrilla stops Guerrilla" -> the attack token rises on the pinned card, the block
       arc self-draws down the vertical axis from the blocker's edge to the attacker's edge,
       and the attack scale-swaps into BLOCKED. */
    tl.fromTo(
      ".gsg-chip-attack",
      { y: -40, scale: 0.9, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      4.3

    // the blocker's facing edge lights as the block leaves it
    tl.to(".gsg-card-up", { borderBottomColor: "#FFED72", duration: 0.25, ease: "power1.out" }, 5.7);

    // svg-path-draw: blocker's lower edge -> attacker's upper edge, bowing across the gap

      tl.fromTo(
        arcPath,
        { strokeDashoffset: arcLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },

    // scale-swap-transition: outgoing shrinks away fast, incoming pops on top with weight
    tl.to(".gsg-chip-attack", { scale: 0.72, opacity: 0, duration: 0.32, ease: "power2.in" }, 5.85);
    tl.fromTo(
      ".gsg-chip-blocked",
      { scale: 0.72, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" },
      5.95
    );

    // the arc lands on the attacker's edge
    tl.to(".gsg-card-low", { borderTopColor: "#FFED72", duration: 0.25, ease: "power1.out" }, 6.15);

    /* ============ SCENE 4 (6.2-7.616s) — the rule line lands and HOLDS ============
       The pinned card has not moved since Scene 1; its stillness is the claim. */
    tl.fromTo(".gsg-ruleblock", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.05);
    tl.fromTo(
      ".gsg-rule-hairline",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      6.15
    );

    // dynamic-content-sequencing — the flat entry timeline is pre-computed ONCE here, and the
    // DOM swaps only on an entry transition (a per-frame textContent write flickers in render).
    var BASE_DURATION = 0.45;  // minimum per-entry read time, regardless of length
    var SEC_PER_CHAR = 0.010;
    var HOLD_MID = 0.02;
    var HOLD_FINAL = 0.10;     // closing beat, a clear margin over HOLD_MID
    var SEQ_ORIGIN = 6.15;
    var CONTENT = [{ text: "no cross-role blocks" }, { text: "guerrilla / guerrilla" }];

    var cumulative = 0;
    var TIMELINE = CONTENT.map(function (entry, i) {
      var hold = i === CONTENT.length - 1 ? HOLD_FINAL : HOLD_MID;
      var dur = BASE_DURATION + entry.text.length * SEC_PER_CHAR + hold;
      var start = cumulative;
      cumulative += dur;
      return { text: entry.text, start: start, end: cumulative };
    });

    var ruleTextEl = document.querySelector(".gsg-rule-text");
    /* seek-safe form: tl.set at each scheduled threshold, the first entry seated at 0 so a cold
       seek to t=0 shows it (the same string is also the authored HTML default). */
    tl.set(ruleTextEl, { textContent: TIMELINE[0].text }, 0);
    TIMELINE.forEach(function (entry, i) {
      if (i === 0) return;
      tl.set(ruleTextEl, { textContent: entry.text }, SEQ_ORIGIN + entry.start);
    });

    // full-span anchor so the sub-composition timeline spans its whole scene window
    tl.to({}, { duration: DUR }, 0);

    window.__timelines["09-guerrilla-stops-guerrilla"] = tl;
    tl.seek(0);
  })();
