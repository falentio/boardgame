  <script>
    (function () {
      var DURATION = 5.419;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* collapsed start states pinned at t=0 — seek-safe, so a delayed
         entrance never flashes its CSS-default (visible) state beforehand */
      tl.set(
        ["#f01-cardA", "#f01-cardB", "#f01-coinA", "#f01-coinB", "#f01-counter"],
        { opacity: 0 },
        0
      );
      tl.set(["#f01-rule-stub", "#f01-rail", "#f01-divider", "#f01-bar"], { scaleX: 0 }, 0);
      tl.set("#f01-kicker", { y: -12 }, 0);

      /* ── Scene 1 (0.0–1.4) : ink field, chrome, ONE card back ───────────
         Layered Depth — field (grid) · card back · chrome (rule stub + kicker). */
      tl.fromTo(
        "#f01-grid",
        { opacity: 0 },
        { opacity: 1, duration: 1.1, ease: "power2.out" },
        0
      );
      tl.fromTo(
        "#f01-rule-stub",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.08
      );
      tl.fromTo(
        "#f01-kicker",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.18
      );
      tl.fromTo(
        "#f01-divider",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.75, ease: "power2.inOut" },
        0.3
      );

      /* the first card back — slide-up settle (spring-pop-entrance, no overshoot) */
      tl.fromTo(
        "#f01-cardA",
        { y: 150, scale: 0.62, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.15
      );

      /* ── Scene 2 (1.4–2.8) : the second card lands, pair reads as one ─── */
      tl.fromTo(
        "#f01-cardB",
        { y: 150, scale: 0.62, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        1.62
      );

      /* ── Scene 3 (2.8–4.4) : rail, coins one per beat, mono counter ─────
         dynamic-content-sequencing: start/end computed from content config,
         never hardcoded per item. */
      tl.fromTo(
        "#f01-rail",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
        2.62
      );

      var COINS = [
        { id: "#f01-coinA", chars: 4, hold: 0.0 },
        { id: "#f01-coinB", chars: 4, hold: 0.0 }
      ];
      var BASE_DURATION = 0.62;
      var SEC_PER_CHAR = 0.02;
      var cumulative = 2.9;
      var COIN_TIMELINE = COINS.map(function (entry) {
        var dur = BASE_DURATION + entry.chars * SEC_PER_CHAR + entry.hold;
        var start = cumulative;
        cumulative += dur;
        return { id: entry.id, start: start, end: cumulative };
      });

      var DROP_DUR = 0.6;
      COIN_TIMELINE.forEach(function (coin) {
        tl.fromTo(
          coin.id,
          { y: -180, scale: 0.86, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: DROP_DUR, ease: "power3.out" },
          coin.start
        );
      });

      tl.fromTo(
        "#f01-counter",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.6
      );

      /* mono counter — discrete-text-sequence: whole-state swap at thresholds.
         Seek-safe form: tl.set at each threshold. A zero-duration set is a
         property tween, so it renders under a cold suppressed seek (an
         onUpdate driver would not). */
      var COUNTER_SEQ = [
        { t: 0.0, text: "0" },
        { t: COIN_TIMELINE[0].start + DROP_DUR, text: "1" },
        { t: COIN_TIMELINE[1].start + DROP_DUR, text: "2" }
      ];
      var counterEl = document.getElementById("f01-counter-val");
      COUNTER_SEQ.forEach(function (entry) {
        tl.set(counterEl, { textContent: entry.text }, entry.t);
      });

      /* ── Scene 4 (4.4–end) : redaction sweep, then the held read ────────
         marker sweep — scaleX 0 → 1 from the left edge, the css-marker-patterns
         highlight mechanic, held at full after the sweep. */
      tl.fromTo(
        "#f01-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.65, ease: "power2.inOut" },
        4.55
      );

      /* subtle jitter on the settled pair — sine-wave-loop, low amplitude, one
         long tween. Seek-safe form: a finite chain of pre-sampled keyframes on
         the wrapper (values computed here, no callback under seek). */
      var IDLE_START = 4.4;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 0.5;
      var Y_AMP_PX = 3;
      var pairEl = document.getElementById("f01-pair");
      var IDLE_STEPS = 20;
      var STEP_DUR = IDLE_DUR / IDLE_STEPS;
      var idleFrames = [];
      for (var si = 1; si <= IDLE_STEPS; si++) {
        idleFrames.push({
          y: Math.sin((si / IDLE_STEPS) * Math.PI * 2 * CYCLES) * Y_AMP_PX,
          duration: STEP_DUR,
          ease: "none"
        });
      }
      tl.to(pairEl, { keyframes: idleFrames, duration: IDLE_DUR, ease: "none" }, IDLE_START);

      window.__timelines["01-two-cards-face-down"] = tl;
    })();
  </script>
