    tl.to("#f10-cam-outer", { scale: 1, duration: 0.95, ease: "power3.inOut" }, 3.6);
    tl.to("#f10-cam-inner", { x: 0, y: 0, duration: 0.95, ease: "power3.inOut" }, 3.6);
    tl.to("#f10-card", { opacity: 0, scale: 0.94, duration: 0.55, ease: "power2.in" }, 3.62);

    tl.fromTo("#f10-strip", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 4.5);
    tl.fromTo(".f10-kicker-tre", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.62);

    var c2 = document.getElementById("f10-counter2");
    /* counting-dynamic-scale, seek-safe form: discrete value steps + transform-only growth */
    tl.set(c2, { textContent: "7" }, 0);
    tl.set(c2, { textContent: "8" }, 4.85);
    tl.set(c2, { textContent: "9" }, 5.05);
    tl.set(c2, { textContent: "10" }, 5.25);
    tl.fromTo(c2, { scale: 0.55 }, { scale: 1, duration: 0.85, ease: "power3.out" }, 4.7);
    tl.fromTo(".f10-strip-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.9);

    gsap.utils.toArray(".f10-row").forEach(function (row, i) {
      tl.fromTo(row, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.62 + i * 0.06);
    });

    /* ---- SCENE 4 (5.6 - 7.851) : "only move" pins, the rest greys to cream-hint ---- */
    tl.fromTo(".f10-onlymove-wrap", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 5.62);
    tl.fromTo("#f10-bloom", { opacity: 0, scale: 0.72 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 5.72);

    gsap.utils.toArray(".f10-row:not(.f10-row-coup)").forEach(function (row, i) {
      var at = 5.78 + i * 0.045;
      tl.to(row, { opacity: 0.5, duration: 0.5, ease: "power2.out" }, at);
      tl.to(row.querySelector(".f10-row-name"), { color: "#B4BABB", duration: 0.5, ease: "power2.out" }, at);
      tl.to(row.querySelector(".f10-row-cost"), { color: "#B4BABB", duration: 0.5, ease: "power2.out" }, at);
    });
    tl.to(".f10-row-coup", { scale: 1.04, duration: 0.5, ease: "power2.out" }, 5.9);

    /* asr-keyword-glow — one linear driver sweeps scene time through a per-word
       attack/sustain/release envelope. Seek-safe form: the envelope is pre-sampled
       into keyframes at build time (no per-frame callback, no style writes). */
    var ATTACK = 0.16;
    var RELEASE = 0.5;
    var REST = 0.25;
    var MAX_BLUR = 26;
    var MAX_BOOST = 0.075;
    var TIMINGS = {
      only: { start: 5.75, end: 6.15 },
      move: { start: 6.15, end: 6.62 }
    };
    var words = gsap.utils.toArray(".f10-word");
    function envelope(time, start, end) {
      if (time < start) return 0;
      if (time < end) return Math.min((time - start) / ATTACK, 1);
      var releaseEnd = end + RELEASE;
      if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST);
      return REST;
    }
    var GLOW_STEPS = 30;
    var GLOW_FROM = 5.5;
    var GLOW_TO = D;
    words.forEach(function (el) {
      var tm = TIMINGS[el.getAttribute("data-word")];
      if (!tm) return;
      var frames = [];
      for (var gi = 0; gi <= GLOW_STEPS; gi++) {
        var gt = GLOW_FROM + (gi / GLOW_STEPS) * (GLOW_TO - GLOW_FROM);
        var env = envelope(gt, tm.start, tm.end);
        frames.push({
          textShadow: "0 0 " + MAX_BLUR * env + "px rgba(255,237,114," + (0.9 * env).toFixed(3) + ")",
          scale: 1 + MAX_BOOST * env
        });
      }
      tl.set(el, { textShadow: "0 0 0px rgba(255,237,114,0)", scale: 1 }, 0);
      tl.to(el, { keyframes: frames, duration: GLOW_TO - GLOW_FROM, ease: "none" }, GLOW_FROM);
    });

    window.__timelines["10-seven-coins-buys-a-coup"] = tl;
  })();
