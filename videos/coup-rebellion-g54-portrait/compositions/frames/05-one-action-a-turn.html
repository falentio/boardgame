      );
      /* copy fades up during the settle, never after it */
      tl.fromTo(
        "#f05-band-upper-row",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        4.85
      );
      tl.fromTo(
        "#f05-band-lower-row",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        5.05
      );

      tl.fromTo(
        "#f05-subline",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        5.6
      );

      /* sine-wave-loop — counter-phase idle on the pair, sin(0)=0 at the settle so
         the handoff from the entrance is seamless (upper sin(t), lower sin(t+π)) */
      var IDLE_START = 5.9;
      var IDLE_DUR = DURATION - IDLE_START;
      var IDLE_AMP = 4;
      var IDLE_STEPS = 16;
      var idleUpper = [];
      var idleLower = [];
      for (var si = 0; si <= IDLE_STEPS; si++) {
        var phase = (si / IDLE_STEPS) * Math.PI;
        idleUpper.push({ y: Math.sin(phase) * IDLE_AMP });
        idleLower.push({ y: Math.sin(phase + Math.PI) * IDLE_AMP });
      }
      tl.to("#f05-band-upper", { keyframes: idleUpper, duration: IDLE_DUR, ease: "none" }, IDLE_START);
      tl.to("#f05-band-lower", { keyframes: idleLower, duration: IDLE_DUR, ease: "none" }, IDLE_START);

      window.__timelines["05-one-action-a-turn"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
