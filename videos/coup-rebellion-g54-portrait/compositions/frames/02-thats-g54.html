      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ═══ Scene 1 (0.0–1.6s) — the in-place token swap IS the beat ═══ */

      /* ambient ground build — the field's depth arrives behind the type */

        "#f02-grid",
        { opacity: 0 },
        { opacity: 1, duration: 1.4, ease: "power2.out" },
        0,
      );

      /* "that's" slams in centred — kinetic-beat-slam, entrance axis 1:
         scale + blur slam. Resolves by 0.45s so the hero is readable well
         inside the t <= 0.5s gate. */
      tl.fromTo(
        "#f02-hw-a",
        { scale: 1.5, opacity: 0, filter: "blur(16px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        BEATS[0],
      );

      /* discrete-text-sequence — whole STATES swapped at a frame threshold.
         Each state is a zero-duration property set: the jump is INSTANT (no
         interpolation on the token) and, unlike a callback, a property tween
         is seek-safe AND reversible, so a backward seek restores the earlier
         token exactly. The small lowercase "that's" hard-cuts in place to the
         28cqw "coup" on the spoken word — this cut IS the beat. */
      tl.set("#f02-hw-b", { autoAlpha: 1 }, BEATS[1]);
      tl.set("#f02-hw-a", { autoAlpha: 0 }, BEATS[1]);

      /* the new token lands heavy — a short power2 settle, not a cross-fade */
      tl.fromTo(
        "#f02-hw-b",
        { scale: 1.06 },
        { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false },
        BEATS[1],
      );

      /* the stub ornament draws on with the swapped word */
      tl.fromTo(
        "#f02-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.36, ease: "power3.out" },
        BEATS[1] + 0.06,
      );

      /* ═══ Scene 2 (1.6–3.0s) — the lockup completes word by word ═══

         ease family (kinetic-beat-slam's variation rule). */

        "#f02-l2",
        { y: 64, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" },

      tl.fromTo(

        { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
        2.9,

      /* slide-up settle — spring-pop-entrance: smooth long tail, no overshoot */

        "#f02-rail1",
        { yPercent: 118, scale: 0.96, opacity: 0 },
        { yPercent: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        3.0,
      );

      /* ═══ Scene 4 (4.4–5.6s) — the win-condition rail, then hold ═══ */
      tl.fromTo(
        "#f02-rail2",
        { yPercent: 118, scale: 0.96, opacity: 0 },
        { yPercent: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        4.48,

      /* "face down" ignites on the lone accent as the voice reaches it */

        "#f02-accent",
        { color: "#f2fffc" },
        { color: "#ffed72", duration: 0.45, ease: "power3.out" },
        5.62,
      );

      /* ═══ resting-hero aliveness — sine-wave-loop ═══
         The idle rides the WRAPPER, so no entrance tween shares its transform.
         Authored as a finite chain of seek-safe keyframes (real property
         tweens, no callbacks): the values are sampled from the rule's
         dual-frequency register at build time — deterministic, and correct
         under every seek order, including a suppressed cold seek. IDLE_DUR >
         6s, so amplitudes sit at the low end, the period slows to ~3s, and an
         envelope fades the drift to zero before the cut. */
      var IDLE_START = 1.15;
      var IDLE_DUR = DURATION - IDLE_START;
      var CYCLES = 2.05; /* period ≈ 3.0s */
      var SCALE_AMP = 0.006;
      var ROT_AMP = 0.22; /* degrees */
      var FADE_FRAC = 0.2;
      var STEPS = 16;
      var STEP_DUR = IDLE_DUR / STEPS;
      var idleFrames = [];
      for (var i = 1; i <= STEPS; i++) {
        var frac = i / STEPS;
        var env = frac < 1 - FADE_FRAC ? 1 : (1 - frac) / FADE_FRAC;
        var p = Math.PI * 2 * CYCLES * frac;
        var s1 = Math.sin(p) * env;
        var s2 = Math.sin(p * 3) * env;
        idleFrames.push({
          scale: 1 + s1 * SCALE_AMP + s2 * SCALE_AMP * 0.35,
          rotation: s1 * ROT_AMP + s2 * ROT_AMP * 0.3,
          duration: STEP_DUR,
          ease: "none",
        });
