<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  /* ---- Scene 1 - an empty five-row rail fills the content area. On "Tonight's
     five" the rail draws itself in (svg-path-draw): every path is measured with
     getTotalLength() - real geometry, never a magic number - and each segment
     starts at ~70-80% of the previous one, so the eye reads one continuous
     stroke rather than eight isolated animations. ---- */
  var rail = [
    ["f04-rail-left", 0.02, 0.14],
    ["f04-rail-top", 0.12, 0.10],
    ["f04-rail-d1", 0.18, 0.08],
    ["f04-rail-d2", 0.23, 0.08],
    ["f04-rail-d3", 0.28, 0.08],
    ["f04-rail-d4", 0.33, 0.08],
    ["f04-rail-bottom", 0.38, 0.10],
    ["f04-rail-right", 0.44, 0.16]
  ];
  rail.forEach(function (spec) {
    var el = document.getElementById(spec[0]);
    if (!el) return;
    var len = el.getTotalLength();
    el.style.strokeDasharray = String(len);
    tl.fromTo(el,
      { strokeDashoffset: len },
      { strokeDashoffset: 0, duration: spec[2], ease: "power2.out" },
      spec[1]);
  });

  /* the chrome and the deep underprint settle in around the rail */
  tl.fromTo("#f04-vignette", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);
  tl.fromTo("#f04-underprint", { opacity: 0 }, { opacity: 0.14, duration: 1.5, ease: "power1.out" }, 0.06);
  tl.fromTo("#f04-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.02);
  tl.fromTo("#f04-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.10);
  tl.fromTo("#f04-meta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.18);
  tl.fromTo("#f04-hairline", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.20);

  /* ---- Scene 2 - one row lands per spoken name (spring-pop-entrance, five
     arrivals paced to the roll call: Banker, Director, Guerrilla, Politician,
     Peacekeeper). Each row slides in from the left rail edge and settles; its
     mark draws in just behind it. ---- */
  var rows = [
    { row: "f04-row-banker", glyph: "f04-glyph-banker", at: 1.18 },
    { row: "f04-row-director", glyph: "f04-glyph-director", at: 1.86 },
    { row: "f04-row-guerrilla", glyph: "f04-glyph-guerrilla", at: 2.42 },
    { row: "f04-row-politician", glyph: "f04-glyph-politician", at: 3.14 },
    { row: "f04-row-peacekeeper", glyph: "f04-glyph-peacekeeper", at: 3.82 }
  ];
  rows.forEach(function (r) {
    tl.fromTo("#" + r.row,
      { x: -52, scale: 0.88, opacity: 0 },
      { x: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      r.at);

    var paths = Array.prototype.slice.call(
      document.querySelectorAll("#" + r.glyph + " .f04-gp")
    );
    paths.forEach(function (p) {
      var len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      tl.fromTo(p,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        r.at + 0.26);
    });
  });

  /* ---- Scene 3 - on "one from each category" a mono category tag snaps at the
     right of each row in its own category hue (staggered pop): finance
     mk-orange, communications mk-cyan, force mk-red, special interest mk-green.
     The receipt strip lands with them. This is the video's colour key. ---- */
  var tags = [
    { tag: "f04-tag-banker", at: 4.88 },
    { tag: "f04-tag-director", at: 4.99 },
    { tag: "f04-tag-guerrilla", at: 5.10 },
    { tag: "f04-tag-politician", at: 5.21 },
    { tag: "f04-tag-peacekeeper", at: 5.32 }
  ];
  tags.forEach(function (t) {
    tl.fromTo("#" + t.tag,
      { scale: 0, opacity: 0, y: 10 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },
      t.at);
  });

  ["f04-key-finance", "f04-key-communications", "f04-key-force", "f04-key-interest"].forEach(function (id, i) {
    tl.fromTo("#" + id,
      { scale: 0, opacity: 0, y: 8 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      5.40 + i * 0.06);
  });

  /* the macro move underneath the whole shot: one slow push-in. Then it holds -
     no exit tween; the root transition is the exit. */
  tl.fromTo("#f04-railbox", { scale: 1 }, { scale: 1.022, duration: 6.15, ease: "none" }, 0.04);

  window.__timelines["04-tonights-five"] = tl;
  tl.seek(0);
})();
